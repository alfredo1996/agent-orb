# The gate for every PR into dev and main (PROJECT.md §14).
# Not here yet: the mod's engine tests (`claude plugin test packages/mod`) and `claude plugin validate`,
# which need the Claude Code binary; run them locally until a pinned build can be installed here.
# The mod's typecheck is here: it reads the pinned vendor/claude-code.d.ts, so it needs no binary (refresh note: packages/mod/tsconfig.json).
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests, studio build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version comes from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fails on a high or critical advisory in what the image ships)
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm exec tsc -p packages/mod
      - run: pnpm test # no container: the server's tests run on temp SQLite files
      - name: Memory soak (the server's RSS stays under its limit on a session the size of the biggest)
        # In the Dockerfile's own node:22-alpine, the musl the server ships on. On the runner's Node (glibc) the RSS sits 25-35 MB higher and
        # jumped 30-70 MB between rounds on unchanged code, failing PRs with no leak (#113). The image is the Dockerfile's last stage, the one the
        # server runs in (the build stages carry --platform), so Dependabot's digest bumps move it too. The repo's node_modules work in the
        # container: nothing on the soak's path is native (node:sqlite is built in).
        run: |
          docker run --rm --memory 1500m -v "$PWD":/repo:ro -w /repo "$(awk '/^FROM / { image = $2 } END { print image }' packages/server/Dockerfile)" \
            node --expose-gc packages/server/scripts/soak.ts
      - name: Studio build
        run: pnpm --filter @agent-orb/studio build

  image:
    name: Server image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/server/Dockerfile .
