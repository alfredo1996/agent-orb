# Publishes the server image to GHCR when a release tag (v0.1.0, …) is pushed (PROJECT.md §10).
# The image tag drops the "v": v0.1.0 → ghcr.io/alfredo1996/agent-orb-server:0.1.0, the tag deploy/docker-compose.yml
# names, plus :latest. Bump that compose tag in the release PR before tagging.
# It needs the same GitHub billing as CI; until a tag publishes, `docker compose up -d` builds the image from the clone.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Server image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alfredo1996/agent-orb-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64 # Apple silicon and most servers
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
