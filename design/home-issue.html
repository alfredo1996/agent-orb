<style>/* Proposed studio library, scoped to .prop. Tokens are the approved Live v3 language (design/live-v3.html). */

  --accent: #9c9aff; --accent-soft: #24244a; --accent-ink: #c2c1ff; --on-accent: #0e0f17;
  --data: #8c93b8; --data-soft: #23263a;

  --shadow: none; --pop: 0 8px 28px rgba(0, 0, 0, .5); } }

.prop .p-select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

.prop .p-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.prop .p-track.m-opus i { background: var(--opus); } .prop .p-track.m-sonnet i { background: var(--sonnet); } .prop .p-track.m-haiku i { background: var(--haiku); }

.prop .p-notice.bad .i { background: var(--bad-dot); color: #fff; }

/* Tooltip */
.prop .p-tip { display: inline-grid; gap: 4px; max-width: 280px; padding: 9px 12px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: var(--pop); }

@media (prefers-reduced-motion: no-preference) {

}
@keyframes p-shimmer { to { background-position: -200% 0; } }

/* Drawer */
.prop .p-drawer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px 0 0 14px; box-shadow: var(--pop); display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }

.prop .p-ev { display: grid; grid-template-columns: 64px 72px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 14px; }

<style>/* Page layouts for the studio mocks, on top of prop.css (the approved library). Phone = the app's own width <= 720px. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--rv-bg); color: var(--rv-ink); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
:root { --rv-bg: #e9e9f1; --rv-ink: #15162a; --rv-muted: #585b73; --rv-line: #cfd1de; --rv-surface: #ffffff; --rv-accent: #4f4bd0; --rv-on: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rv-bg: #08090f; --rv-ink: #e9eaf4; --rv-muted: #a3a6c0; --rv-line: #34374d; --rv-surface: #161826; --rv-accent: #9c9aff; --rv-on: #0e0f17; color-scheme: dark; } }
:root[data-theme="dark"] { --rv-bg: #08090f; --rv-ink: #e9eaf4; --rv-muted: #a3a6c0; --rv-line: #34374d; --rv-surface: #161826; --rv-accent: #9c9aff; --rv-on: #0e0f17; color-scheme: dark; }

/* Review bar: not part of the app */
.rv { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px dashed var(--rv-line); font-size: 13px; color: var(--rv-muted); }
.rv b { color: var(--rv-ink); font-weight: 600; }
.rv-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rv-line); border-radius: 8px; overflow: hidden; }
.rv-seg button { border: 0; background: var(--rv-surface); color: var(--rv-ink); padding: 6px 11px; min-height: 32px; font: inherit; cursor: pointer; }
.rv-seg button + button { border-left: 1px solid var(--rv-line); }
.rv-seg button[aria-pressed="true"] { background: var(--rv-accent); color: var(--rv-on); }
.stage.phone { padding-block: 24px; }
.stage.phone .app { width: 390px; margin: 0 auto; border: 1px solid var(--rv-line); border-radius: 22px; overflow: hidden; min-height: 820px; }
.decide { max-width: 1280px; margin: 0 auto; padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.decide h2 { margin: 0 0 8px; font: 700 20px/1.2 "Bricolage Grotesque", system-ui, sans-serif; color: var(--rv-ink); }
.decide ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 100ch; color: var(--rv-ink); font-size: 14px; }
.decide code { font-family: "IBM Plex Mono", monospace; font-size: 13px; }

/* App shell */
.app { container: app / inline-size; position: relative; min-height: 100vh; }
.app .p-top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app .p-nav a { cursor: pointer; }
.app .menu { display: none; }
.app .page { max-width: 1280px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.app .page > * { min-width: 0; }
.app .hrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.app .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.app .foot { font-size: 13px; color: var(--faint); }
.app .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.app .grid2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.app .stack { display: grid; gap: 16px; align-content: start; }

/* Live (the approved v3 rows) */
.app .needs .need { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px 16px; padding: 12px 20px; border-top: 1px solid var(--line); }
.app .needs .need:first-of-type { border-top: 0; }

      'The story has one line per agent run, oldest first, and a line opens that agent in Live.',
      'A stage shows when it was first reached, and when it came round again. It shows no durations: a night with no session would count as hours of fixing.',
      'Related issues come first from the files two issues both wrote, which is already recorded. "In flight together" marks two unmerged issues that wrote the same file.',
      'Mentions need the plugin to read issue bodies, with only the numbers leaving the machine. They can be left out.',
      'The same links are drawn for the whole milestone on the Map, and the card links to it.',
    ] },
    missing: { label: 'Missing data', render: missing, decide: ['Every missing case says why in words, as on the Factory page.'] },
    reads: { label: 'What it reads', render: reads, decide: [
      'Neither page needs a new hook. One part needs a new read, the mentions, and it is optional.',
      `Home asks about every project at once, so it reads counts and the rows in flight, not each project's whole board.`,
    ] },
  };

  const pageSeg = $('#rv-page');
  pageSeg.innerHTML = Object.entries(BOARDS).map(([k, b]) => `<button type="button" data-v="${k}" aria-pressed="${k === state.board}">${b.label}</button>`).join('');
  const render = () => {
    const b = BOARDS[state.board];
    $('#page').innerHTML = b.render();
    $('#rv-casewrap').hidden = !b.cases;
    if (b.cases) {
      $('#rv-caselabel').textContent = b.caseLabel;
      $('#rv-case').innerHTML = b.cases.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === state.cases[state.board]}">${l}</button>`).join('');
    }
    [...pageSeg.children].forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === state.board));
    $('#decide').innerHTML = `<h2>On this board</h2><ol>${b.decide.map((d) => `<li>${d}</li>`).join('')}</ol>`;
    document.querySelectorAll('.p-nav a').forEach((a) => (b.nav && a.dataset.nav === b.nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  };
  const go = (k) => { state.board = k; try { history.replaceState(null, '', `#${k}`); } catch {} render(); scrollTo(0, 0); };
  document.addEventListener('click', (e) => {
    const node = e.target.closest('[data-node]');
    if (node) { state.sel = state.sel === +node.dataset.node ? null : +node.dataset.node; render(); return; }
    const i = e.target.closest('[data-issue]');
    if (i) { e.preventDefault(); state.cases.issue = i.dataset.issue; go('issue'); return; }
    const c = e.target.closest('[data-case]');
    if (c) { state.cases[state.board] = c.dataset.case; render(); return; }
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); go(g.dataset.go); }
  });
  const seg = (id, f) => $(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; [...b.parentElement.children].forEach((x) => x.setAttribute('aria-pressed', x === b)); f(b.dataset.v); });
  seg('#rv-page', go);
  seg('#rv-case', (v) => { state.cases[state.board] = v; render(); });
  seg('#rv-theme', (v) => (v === 'system' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', v)));
  seg('#rv-width', (v) => $('#stage').classList.toggle('phone', v === 'phone'));
  addEventListener('hashchange', () => { const k = location.hash.slice(1); if (BOARDS[k] && k !== state.board) go(k); });
  const start = location.hash.slice(1);
  if (BOARDS[start]) state.board = start;
  render();
})();</script>
