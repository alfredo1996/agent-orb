<style>/* Proposed studio library, scoped to .prop. Tokens are the approved Live v3 language (design/live-v3.html). */
.prop {
  --bg: #f5f5f9; --surface: #ffffff; --sunk: #f0f0f6; --line: #e2e3ec; --line-strong: #cfd1de;
  --ink: #15162a; --muted: #585b73; --faint: #80839b;
  --accent: #4f4bd0; --accent-soft: #ecebfb; --accent-ink: #3a36b0; --on-accent: #ffffff;
  --data: #5c6488; --data-soft: #e3e5ee;
  --ok: #15703f; --ok-bg: #e2f3e8; --ok-dot: #1f9d55;
  --wait: #7f4f00; --wait-bg: #fff1d1; --wait-dot: #d99300;
  --bad: #ae1f27; --bad-bg: #fde8e8; --bad-dot: #e0343c;
  --done: #5f6378; --done-bg: #eceef4; --done-dot: #9a9db0;
  --opus: #b03a8e; --sonnet: #2566d6; --haiku: #009a85;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --shadow: 0 1px 2px rgba(21, 22, 42, .04), 0 2px 8px rgba(21, 22, 42, .04);
  --pop: 0 8px 28px rgba(21, 22, 42, .16);
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .prop {
  --bg: #0e0f17; --surface: #161826; --sunk: #12131f; --line: #262839; --line-strong: #34374d;
  --ink: #e9eaf4; --muted: #a3a6c0; --faint: #74778f;
  --accent: #9c9aff; --accent-soft: #24244a; --accent-ink: #c2c1ff; --on-accent: #0e0f17;
  --data: #8c93b8; --data-soft: #23263a;
  --ok: #56d48f; --ok-bg: #11301f; --ok-dot: #3fc47c;
  --wait: #f2bd4d; --wait-bg: #36290b; --wait-dot: #e6a823;
  --bad: #ff8a8f; --bad-bg: #3b1518; --bad-dot: #f0545b;
  --done: #a3a6c0; --done-bg: #212334; --done-dot: #6b6e86;
  --opus: #cf62bd; --sonnet: #5f92f2; --haiku: #18a690;
  --shadow: none; --pop: 0 8px 28px rgba(0, 0, 0, .5); } }
:root[data-theme="dark"] .prop {
  --bg: #0e0f17; --surface: #161826; --sunk: #12131f; --line: #262839; --line-strong: #34374d;
  --ink: #e9eaf4; --muted: #a3a6c0; --faint: #74778f;
  --accent: #9c9aff; --accent-soft: #24244a; --accent-ink: #c2c1ff; --on-accent: #0e0f17;
  --data: #8c93b8; --data-soft: #23263a;
  --ok: #56d48f; --ok-bg: #11301f; --ok-dot: #3fc47c;
  --wait: #f2bd4d; --wait-bg: #36290b; --wait-dot: #e6a823;
  --bad: #ff8a8f; --bad-bg: #3b1518; --bad-dot: #f0545b;
  --done: #a3a6c0; --done-bg: #212334; --done-dot: #6b6e86;
  --opus: #cf62bd; --sonnet: #5f92f2; --haiku: #18a690;
  --shadow: none; --pop: 0 8px 28px rgba(0, 0, 0, .5); }

.prop *, .prop *::before, .prop *::after { box-sizing: border-box; }
.prop .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.prop :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Shell */
.prop .p-top { display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.prop .p-brand { display: flex; align-items: center; gap: 10px; font: 700 17px/1 var(--display); letter-spacing: -.01em; }
.prop .p-orb { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #c9cbff 0, #7b7cf0 38%, #3c3aa8 78%, #26246e 100%); box-shadow: 0 0 0 3px var(--accent-soft); }
.prop .p-nav { display: flex; gap: 2px; align-self: stretch; }
.prop .p-nav a { display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; min-height: 44px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; }
.prop .p-nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.prop .p-count { font: 500 12px/1 var(--mono); padding: 3px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
.prop .p-conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.prop .p-conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-dot); box-shadow: 0 0 0 3px var(--ok-bg); }

/* Page header and tally */
.prop .p-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; }
.prop .p-head h1 { margin: 0; font: 700 30px/1.1 var(--display); letter-spacing: -.02em; }
.prop .p-head .p-sub { font-size: 14px; color: var(--muted); }
.prop .p-tally { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); }
.prop .p-tally span { display: inline-flex; align-items: center; gap: 7px; }
.prop .p-tally span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c-dot); }

/* Buttons and links */
.prop .p-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 14px/1 var(--sans); cursor: pointer; text-decoration: none; }
.prop .p-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.prop .p-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.prop .p-btn.primary:hover { filter: brightness(1.08); color: var(--on-accent); }
.prop .p-btn[disabled] { background: var(--sunk); border-color: var(--line); color: var(--faint); cursor: not-allowed; filter: none; }
.prop .p-link { color: var(--accent-ink); font-weight: 600; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
.prop .p-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Segmented toggle */
.prop .p-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); }
.prop .p-seg button { min-height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--muted); font: 500 14px/1 var(--sans); cursor: pointer; }
.prop .p-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--line-strong); font-weight: 600; box-shadow: var(--shadow); }

/* Fields */
.prop .p-field { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.prop .p-select, .prop .p-input { min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-strong); background-color: var(--surface); color: var(--ink); font: 400 14px/1 var(--sans); }
.prop .p-select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.prop .p-input.money { font-family: var(--mono); width: 120px; }
.prop .p-select:focus, .prop .p-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

/* Card */
.prop .p-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.prop .p-card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.prop .p-card-h h3 { margin: 0; font: 600 15px/1.3 var(--sans); }
.prop .p-card-h .p-hint { font-size: 13px; color: var(--muted); }
.prop .p-card-b { padding: 16px 20px; }

/* State pill, model tag, chips */
.prop .p-state { display: inline-flex; align-items: center; gap: 7px; font: 600 13px/1 var(--sans); white-space: nowrap; padding: 6px 10px; border-radius: 999px; }
.prop .p-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c-dot); }
.prop .s-working { --c-dot: var(--ok-dot); color: var(--ok); background: var(--ok-bg); }
.prop .s-waiting { --c-dot: var(--wait-dot); color: var(--wait); background: var(--wait-bg); }
.prop .s-stalled, .prop .s-error { --c-dot: var(--bad-dot); color: var(--bad); background: var(--bad-bg); }
.prop .s-done { --c-dot: var(--done-dot); color: var(--done); background: var(--done-bg); }
.prop .p-model { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; }
.prop .p-model::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--m); }
.prop .m-opus { --m: var(--opus); } .prop .m-sonnet { --m: var(--sonnet); } .prop .m-haiku { --m: var(--haiku); }
.prop .p-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 7px; background: var(--sunk); border: 1px solid var(--line); color: var(--ink); font-size: 13px; white-space: nowrap; }
.prop .p-chip .mono { font-family: var(--mono); color: var(--accent-ink); }
.prop .p-chip .how { color: var(--muted); }
.prop .p-chip.branch { font-family: var(--mono); color: var(--muted); }
.prop .p-chip.warn { background: var(--wait-bg); border-color: transparent; color: var(--wait); }

/* Tabs */
.prop .p-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.prop .p-tabs button { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font: 500 15px/1 var(--sans); cursor: pointer; }
.prop .p-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.prop .p-tabs .n { font: 500 12px/1 var(--mono); padding: 3px 6px; border-radius: 999px; background: var(--sunk); }

/* Table */
.prop .p-tablewrap { overflow-x: auto; }
.prop table.p-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.prop .p-table th { text-align: left; font: 500 12px/1.2 var(--sans); color: var(--muted); padding: 10px 20px; background: var(--sunk); border-bottom: 1px solid var(--line); white-space: nowrap; }
.prop .p-table td { padding: 12px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.prop .p-table tr:last-child td { border-bottom: 0; }
.prop .p-table .r { text-align: right; }
.prop .p-table .num { font-size: 14px; }
.prop .p-table .sub { display: block; font-size: 13px; color: var(--muted); }
.prop .p-table tbody tr:hover { background: var(--sunk); }

/* Meter and bars */
.prop .p-meter { display: grid; gap: 6px; min-width: 120px; }
.prop .p-meter .k { font-size: 12px; font-weight: 500; color: var(--muted); }
.prop .p-track { height: 6px; border-radius: 3px; background: var(--data-soft); overflow: hidden; }
.prop .p-track i { display: block; height: 100%; border-radius: 3px; background: var(--data); }
.prop .p-track.warn i { background: var(--wait-dot); }
.prop .p-track.ok i { background: var(--ok-dot); }
.prop .p-track.m-opus i { background: var(--opus); } .prop .p-track.m-sonnet i { background: var(--sonnet); } .prop .p-track.m-haiku i { background: var(--haiku); }

/* Avatar */
.prop .p-av { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; font: 600 13px/1 var(--sans); color: #fff; background: var(--m, var(--data)); flex: none; }

/* Stat */
.prop .p-stat { display: grid; gap: 2px; }
.prop .p-stat .k { font-size: 12px; font-weight: 500; color: var(--muted); }
.prop .p-stat .v { font: 500 22px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.prop .p-stat .d { font-size: 13px; color: var(--muted); }

/* Notice */
.prop .p-notice { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); font-size: 14px; }
.prop .p-notice .i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--sans); background: var(--line); color: var(--ink); }
.prop .p-notice p { margin: 0; }
.prop .p-notice code { font-family: var(--mono); font-size: 13px; }
.prop .p-notice.warn { background: var(--wait-bg); border-color: transparent; color: var(--wait); }
.prop .p-notice.warn .i { background: var(--wait-dot); color: #fff; }
.prop .p-notice.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.prop .p-notice.bad .i { background: var(--bad-dot); color: #fff; }

/* Tooltip */
.prop .p-tip { display: inline-grid; gap: 4px; max-width: 280px; padding: 9px 12px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: var(--pop); }
.prop .p-tip b { font-weight: 600; }
.prop .p-tip .row { display: flex; justify-content: space-between; gap: 16px; font-family: var(--mono); }

/* Empty and loading */
.prop .p-empty { display: grid; gap: 6px; justify-items: start; padding: 20px; }
.prop .p-empty b { font-weight: 600; }
.prop .p-empty p { margin: 0; color: var(--muted); font-size: 14px; max-width: 52ch; }
.prop .p-skel { display: grid; gap: 10px; padding: 16px 20px; }
.prop .p-skel i { display: block; height: 12px; border-radius: 6px; background: var(--sunk); }
@media (prefers-reduced-motion: no-preference) {
  .prop .p-skel i { background: linear-gradient(90deg, var(--sunk) 0, var(--line) 50%, var(--sunk) 100%); background-size: 200% 100%; animation: p-shimmer 1.4s linear infinite; }
}
@keyframes p-shimmer { to { background-position: -200% 0; } }

/* Drawer */
.prop .p-drawer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px 0 0 14px; box-shadow: var(--pop); display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
.prop .p-dh { display: grid; gap: 8px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.prop .p-dh .r1 { display: flex; align-items: center; gap: 10px; }
.prop .p-dh h3 { margin: 0; font: 600 20px/1.2 var(--display); }
.prop .p-x { margin-left: auto; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 20px; cursor: pointer; }
.prop .p-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }

/* Timeline */
.prop .p-ev { display: grid; grid-template-columns: 64px 72px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 14px; }
.prop .p-ev .t { font: 13px var(--mono); color: var(--faint); }
.prop .p-ev .tool { font: 500 13px var(--mono); }
.prop .p-ev .target { font: 13px var(--mono); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.prop .p-ev .res { font: 13px var(--mono); white-space: nowrap; }
.prop .ok { color: var(--ok); } .prop .bad { color: var(--bad); } .prop .run { color: var(--accent-ink); }

/* Explain: replaces the grey paragraphs at the foot of pages */
.prop details.p-explain { border-top: 1px solid var(--line); }
.prop details.p-explain summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; padding: 0 20px; font-size: 14px; font-weight: 500; color: var(--accent-ink); }
.prop details.p-explain p { margin: 0; padding: 0 20px 16px; font-size: 14px; color: var(--muted); max-width: 72ch; }

/* Legend */
.prop .p-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.prop .p-legend span { display: inline-flex; align-items: center; gap: 7px; }
.prop .p-legend span::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--m); }

/* Checkbox: the platform control in the accent colour, on a 44px row */
.prop .p-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; cursor: pointer; }
.prop .p-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.prop .p-tasklist { list-style: none; margin: 0; padding: 0; display: grid; }
.prop .p-tasklist li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.prop .p-tasklist li:last-child { border-bottom: 0; }
.prop .p-tasklist .mk { font-family: var(--mono); color: var(--faint); }
.prop .p-tasklist .done .mk { color: var(--ok); } .prop .p-tasklist .now .mk { color: var(--accent-ink); }
.prop .p-tasklist .done span:last-child { color: var(--muted); }
</style>
<style>/* Page layouts for the studio mocks, on top of prop.css (the approved library). Phone = the app's own width <= 720px. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--rv-bg); color: var(--rv-ink); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
:root { --rv-bg: #e9e9f1; --rv-ink: #15162a; --rv-muted: #585b73; --rv-line: #cfd1de; --rv-surface: #ffffff; --rv-accent: #4f4bd0; --rv-on: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rv-bg: #08090f; --rv-ink: #e9eaf4; --rv-muted: #a3a6c0; --rv-line: #34374d; --rv-surface: #161826; --rv-accent: #9c9aff; --rv-on: #0e0f17; color-scheme: dark; } }
:root[data-theme="dark"] { --rv-bg: #08090f; --rv-ink: #e9eaf4; --rv-muted: #a3a6c0; --rv-line: #34374d; --rv-surface: #161826; --rv-accent: #9c9aff; --rv-on: #0e0f17; color-scheme: dark; }

/* Review bar: not part of the app */
.rv { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px dashed var(--rv-line); font-size: 13px; color: var(--rv-muted); }
.rv b { color: var(--rv-ink); font-weight: 600; }
.rv-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rv-line); border-radius: 8px; overflow: hidden; }
.rv-seg button { border: 0; background: var(--rv-surface); color: var(--rv-ink); padding: 6px 11px; min-height: 32px; font: inherit; cursor: pointer; }
.rv-seg button + button { border-left: 1px solid var(--rv-line); }
.rv-seg button[aria-pressed="true"] { background: var(--rv-accent); color: var(--rv-on); }
.stage.phone { padding-block: 24px; }
.stage.phone .app { width: 390px; margin: 0 auto; border: 1px solid var(--rv-line); border-radius: 22px; overflow: hidden; min-height: 820px; }
.decide { max-width: 1280px; margin: 0 auto; padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.decide h2 { margin: 0 0 8px; font: 700 20px/1.2 "Bricolage Grotesque", system-ui, sans-serif; color: var(--rv-ink); }
.decide ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 100ch; color: var(--rv-ink); font-size: 14px; }
.decide code { font-family: "IBM Plex Mono", monospace; font-size: 13px; }

/* App shell */
.app { container: app / inline-size; position: relative; min-height: 100vh; }
.app .p-top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app .p-nav a { cursor: pointer; }
.app .menu { display: none; }
.app .page { max-width: 1280px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.app .page > * { min-width: 0; }
.app .hrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.app .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.app .foot { font-size: 13px; color: var(--faint); }
.app .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.app .grid2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.app .stack { display: grid; gap: 16px; align-content: start; }

/* Live (the approved v3 rows) */
.app .needs .need { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px 16px; padding: 12px 20px; border-top: 1px solid var(--line); }
.app .needs .need:first-of-type { border-top: 0; }

  function roles() {

    </section>${rolePanel()}</div>`;
  }
  function session() {
    const SR = [
      { key: 'orchestrator', types: 'main', agents: 1, tok: 301, cost: 0.33, info: '', x: 405, y: 10 },
      { key: 'planner', types: 'Plan', agents: 1, tok: 109, cost: 0.07, avg: '48s', x: 280, y: 166, from: 'orchestrator', give: 109 },
      { key: 'researcher', types: 'Explore', agents: 1, tok: 62, cost: 0.006, avg: null, x: 530, y: 166, from: 'orchestrator', give: 62 },
    ];
    const t0 = 13 * 60, t1 = 40 * 60; // seconds after 17:00
    const sec = (s) => { const [h, m, x] = s.split(':').map(Number); return (h - 17) * 3600 + m * 60 + (x || 0); };
    const pct = (s) => ((sec(s) - t0) / (t1 - t0)) * 100;

    const lanes = [
      ['main', 'orchestrator', 'opus', span('17:13:05', '17:15:10', '', 'opus') + span('17:15:10', '17:15:58', 'tool', 'opus') + span('17:15:58', '17:21:52', '', 'opus') + span('17:21:52', '17:39:40', 'tool', 'opus')],

        <div class="ax">${ticks.map((t, i) => `<span class="${i % 2 ? '' : 'odd'}" style="left:${pct(t + ':00')}%">${t}</span>`).join('')}</div></div>
      <div style="padding:0 20px 14px"><div class="p-legend"><span style="--m:var(--opus)">Opus</span><span style="--m:var(--sonnet)">Sonnet</span><span style="--m:var(--haiku)">Haiku</span><span style="--m:var(--bad-dot)">stalled</span></div></div></section>`;

  function skills() {
    const S = [['/review', 'project skill · ran 2× · 1.2M', 30], ['/grill', 'project skill · ran 2× · 816k', 121], ['/pr', 'project skill · ran 1× · 369k', 212]];
    const A = [['implementer', 'spawned 9× · 2.6M', 30, ''], ['general-purpose', 'built-in · spawned 4× · 396k', 121, ''], ['reviewer', 'named, never spawned', 212, 'ghost']];
    const E = [[0, 0, 2], [0, 1, 1], [1, 0, 1], [1, 1, 2], [2, 1, 1]], N = [[0, 2], [1, 2]];
    const path = (sy, ay) => { const x1 = 176, x2 = 440, y1 = sy + 29, y2 = ay + 29; return `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}`; };
    let svg = E.map(([s, a, n]) => `<path class="e" d="${path(S[s][2], A[a][2])}" stroke-width="${n * 2}"/>`).join('') + N.map(([s, a]) => `<path class="e named" d="${path(S[s][2], A[a][2])}"/>`).join('');
    svg += [[0, 2], [1, 1], [2, 1]].map(([a, n]) => `<text class="el" x="408" y="${A[a][2] + 18}">${a === 0 ? '3×' : a === 1 ? '4×' : ''}</text>`).join('');
    const max = 2;
    return `${pipeHead('skills', 'week')}

      <div style="padding:0 20px 14px"><div class="p-legend"><span style="--m:var(--accent)">skill</span><span style="--m:var(--line-strong)">agent type</span></div></div>
      <details class="p-explain"><summary>How to read this graph</summary><p>Named: a skill's or agent's text names another skill or an agent type from the session's own list. Called: a Skill call or an agent spawn in the same turn, after the skill loaded. A spawn goes to the skill whose text names it, else to the latest one; tokens go to the skill that started the chain.</p></details></section>
    <section class="p-card"><div class="p-card-h"><h3>Skill usage</h3><span class="p-seg" role="group" aria-label="Sort"><button type="button" aria-pressed="true">By runs</button><button type="button" aria-pressed="false">By tokens</button></span></div>
      <div class="p-card-b" style="font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 24px;border-bottom:1px solid var(--line)"><span>Most used: <b style="color:var(--ink)">/review</b>, 2 runs, 1.2M tok</span><span>Least used that ran: <b style="color:var(--ink)">/pr</b>, 1 run, 369k tok</span><span>/review costs 1.6× as much per run as /pr</span></div>
      <div class="p-tablewrap"><table class="p-table"><thead><tr><th>Skill</th><th>Runs</th><th class="hide-phone">Started by</th><th class="r">Tokens</th><th class="r hide-phone">Per run</th><th class="r">API-eq.</th><th class="r hide-phone">Last used</th><th class="hide-phone">Last 7 days</th></tr></thead><tbody>
        ${SKILL_USAGE.map(([n, runs, by, t, per, c, last, days]) => `<tr><td><span class="mono" style="font-family:var(--mono);color:var(--accent-ink)">${n}</span><span class="sub">project</span></td><td><div class="runs"><span class="num">${runs}</span><span class="p-track"><i style="width:${(runs / max) * 100}%"></i></span></div></td><td class="hide-phone">${by}</td><td class="r num">${tok(t)}</td><td class="r num hide-phone">${tok(per)}</td><td class="r num">${usd(c)}</td><td class="r hide-phone">${last}</td><td class="hide-phone"><svg class="spark" width="70" height="18" viewBox="0 0 70 18" aria-label="${days.reduce((a, b) => a + b, 0)} runs in the last 7 days">${days.map((v, i) => `<rect x="${i * 10}" y="${v ? 4 : 16}" width="7" height="${v ? 14 : 2}" opacity="${v ? 0.9 : 0.3}"/>`).join('')}</svg></td></tr>`).join('')}

  /* ---------- Office ---------- */
  function bot(x, y, m, opts = {}) {
    const c = `var(--${m})`, P = (px, py, w, h, f, o = 1) => `<rect x="${x + px * 2}" y="${y + py * 2}" width="${w * 2}" height="${h * 2}" style="fill:${f}" opacity="${o}"/>`;
    const fade = opts.done ? 0.45 : 1;
    let s = P(5, 0, 1, 2, 'var(--ink)', fade) + P(2, 2, 7, 5, c, fade) + P(3, 3, 2, 2, 'var(--surface)', fade) + P(6, 3, 2, 2, 'var(--surface)', fade) + P(3, 7, 5, 3, c, 0.75 * fade);
    s += P(11, 4, 5, 4, 'var(--ink)', fade) + P(12, 5, 3, 2, 'var(--data-soft)', fade); // monitor
    s += P(0, 10, 18, 2, 'var(--line-strong)') + P(1, 12, 1, 3, 'var(--line-strong)') + P(16, 12, 1, 3, 'var(--line-strong)'); // desk
    if (opts.bubble) s += `<g><rect x="${x + 20}" y="${y - 16}" width="14" height="12" rx="3" style="fill:${opts.bubble[1]}"/><text x="${x + 27}" y="${y - 7}" text-anchor="middle" style="font:700 9px var(--sans);fill:var(--surface)">${opts.bubble[0]}</text></g>`;
    if (opts.done) s += `<text x="${x + 27}" y="${y - 5}" style="font:700 10px var(--sans);fill:var(--ok)">✓</text>`;
    return s;
  }
  function scene(bots, lines) {
    let s = '<rect x="0" y="0" width="240" height="40" style="fill:var(--line)"/><rect x="170" y="10" width="24" height="18" style="fill:var(--data-soft)"/><rect x="198" y="10" width="24" height="18" style="fill:var(--data-soft)"/>';
    for (let i = 0; i < 12; i++) for (let j = 0; j < 6; j++) if ((i + j) % 2) s += `<rect x="${i * 20}" y="${40 + j * 20}" width="20" height="20" style="fill:var(--bg)" opacity=".6"/>`;
    s += lines.map(([x1, y1, x2, y2]) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>`).join('');
    s += '<rect x="14" y="118" width="8" height="12" style="fill:var(--haiku)" opacity=".7"/><rect x="12" y="130" width="12" height="6" style="fill:var(--line-strong)"/>';
    return `<svg class="scene" viewBox="0 0 240 150" role="img">${s}${bots.join('')}</svg>`;
  }
  function office() {
    const room = (s, svg, ids) => {
      const t = s.agents.reduce((n, a) => n + a.tok, 0), cost = s.agents.reduce((n, a) => n + a.cost, 0);
      return `<section class="p-card room" aria-label="Room ${s.project}"><div class="roomh"><h3>${s.project}</h3><span class="nums"><span><b>${tok(t)}</b> tok</span><span><b>${usd(cost)}</b></span><span>context <span class="p-track"><i style="width:${s.ctx || 0}%"></i></span> <b>${s.ctx == null ? '—' : s.ctx + '%'}</b></span></span></div>
        ${svg}<ul class="roster">${ids.map((id) => { const a = AGENTS[id]; return `<li data-agent="${id}" tabindex="0" role="button" aria-label="${a.name}: open its history">${av(a.name[0].toUpperCase(), a.m)}<span class="w"><b style="font-weight:600">${a.name}</b><small>${esc(a.what)}</small></span>${pill(a.st)}</li>`; }).join('')}</ul></section>`;
    };
    const r1 = scene([bot(60, 58, 'opus'), bot(140, 100, 'haiku', { done: true }), bot(60, 108, 'sonnet', { bubble: ['…', 'var(--data)'] })], [[78, 82, 78, 108], [84, 82, 150, 100]]);
    const r2 = scene([bot(100, 76, 'sonnet', { bubble: ['?', 'var(--wait-dot)'] })], []);
    const r3 = scene([bot(60, 58, 'opus'), bot(30, 106, 'sonnet', { done: true }), bot(130, 106, 'haiku', { bubble: ['!', 'var(--bad-dot)'] })], [[70, 82, 40, 106], [86, 82, 140, 106]]);
    return `<div class="p-head"><h1>Your floor</h1><div class="p-tally"><span style="--c-dot:var(--ok-dot)">3 rooms busy</span><span style="--c-dot:var(--data)">7 bots</span><span style="--c-dot:var(--bad-dot)">1 stalled</span><span style="--c-dot:var(--wait-dot)">1 waiting for you</span></div></div>
    <div class="rooms">${room(SESSIONS[0], r1, ['a1', 'a2', 'a3'])}${room(SESSIONS[1], r2, ['b1'])}${room(SESSIONS[2], r3, ['c1', 'c2', 'c3'])}</div>
    <section class="p-card"><details class="p-explain" style="border-top:0"><summary>How to read the office</summary><p>A bot's colour is its model (Opus plum, Sonnet blue, Haiku teal). The screen shows its tool: code for Edit, Write and Bash, a page for Read, Grep and Glob, a globe for the web. A bubble says … thinking, ? waiting for you, ! stalled; a green check means done, and the bot leaves after a minute. A dotted line is a delegation, from the parent's desk to the new bot.</p></details></section>`;
  }

        <div><h4>Skills that waste them</h4><p>/review ran twice at 576k tokens a run: it dispatches general-purpose for a summary the reviewer agent already writes. Five skills never ran and cost 2.5k tokens of listing in every session.</p></div>

  /* ---------- Decisions per board ---------- */
  const DECIDE = {
    live: ['"Open history ›" goes: the whole agent row opens the history.', 'The yellow banner becomes Needs you, listing every agent waiting for you or stalled, oldest first.', 'Agent cards become rows on one grid; subagents hang under their parent; done ones stay, dimmed.', 'Before the first turn ends, Context reads "after the first turn" instead of "—" over an empty bar.', 'The session\'s skills stay as chips under its header, each saying how it started.'],
    ledger: ['The five KPI cards become one stat group card.', 'The filters move to the right of the title; on a phone they wrap under it.', 'The chart tooltip is HTML and also opens on keyboard focus; the busiest day carries its total; the chart gains "Show as a table".', 'By project, by model and by role share one ranked-list style: model rows in model colours, the rest in the data colour.', 'Efficiency by project keeps its columns; on a phone, Waiting on you and Requests drop to save width (they stay on desktop and in the table).'],
    roles: ['Token labels sit at the child end of each edge instead of bunching under the orchestrator; edges leave from spread points.', 'Nodes are HTML over the edge drawing, so their text no longer depends on hard-coded SVG offsets (Pipeline.tsx:159–165). Node size stays 190×94, so <code>pipeline-layout.spec.ts</code> stays green.', 'Picking a role opens its panel on the right: what the role means, its agents, and the role fix (Save role is now a primary button).', '"Where a role comes from" moves into a disclosure at the panel\'s foot.', 'On a phone the chart gives way to the ranked role list, as today.'],

    skills: ['The graph keeps two columns, run first and agents dispatched; node size stays 176×58, so <code>skills-layout.spec.ts</code> stays green.', 'Edge counts sit at the agent end; a dashed edge is a name the text mentions but never called here.', 'The paragraph under the graph becomes "How to read this graph".', 'Skill usage keeps its columns; on a phone, Started by, Per run, Last used and the spark drop.', '"Listed but never ran" chips show tokens per session; the name clash is the amber chip.'],
    office: ['Rooms share equal columns and fill the width instead of leaving half the screen empty.', 'Each room gets a roster under its scene: every bot with what it is doing and its state in words; a row opens the history.', 'The legend moves into "How to read the office".', 'Room headers show tokens, cost and context on one line.'],

  const TITLES = { live: 'Live', ledger: 'Ledger', roles: 'Pipeline · roles', session: 'Pipeline · one session', skills: 'Pipeline · skills', office: 'Office', analysis: 'Analysis' };

  /* ---------- Render and wiring ---------- */
  const RENDER = { live, ledger, roles, session, skills, office, analysis };

  function render() {

    document.querySelectorAll('.p-nav a').forEach((a) => a.toggleAttribute('aria-current', a.dataset.go === NAV[state.board]));
    document.querySelectorAll('.p-nav a[aria-current]').forEach((a) => a.setAttribute('aria-current', 'page'));
    document.querySelectorAll('#rv-page button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state.board)));
    $('#rv-akey').hidden = state.board !== 'analysis';
    $('#decide').innerHTML = `<h2>What the ${TITLES[state.board]} board decides</h2><ol>${DECIDE[state.board].map((d) => `<li>${d}</li>`).join('')}</ol>`;
    if (state.board === 'ledger') wireChart();
  }
  function wireChart() {
    const box = $('#chartbox'), tip = $('#ctip');
    const show = (g) => {
      const i = +g.dataset.i, t = WEEK.opus[i] + WEEK.sonnet[i] + WEEK.haiku[i];
      tip.innerHTML = `<b>${WEEK.days[i]} · ${t.toFixed(1)}M tok</b><span class="row"><span>Opus</span><span>${WEEK.opus[i].toFixed(1)}M</span></span><span class="row"><span>Sonnet</span><span>${WEEK.sonnet[i].toFixed(1)}M</span></span><span class="row"><span>Haiku</span><span>${WEEK.haiku[i].toFixed(1)}M</span></span><span class="row"><span>API-equivalent</span><span>$${WEEK.cost[i].toFixed(2)}</span></span>`;
      tip.hidden = false;
      const r = g.querySelector('path').getBoundingClientRect(), b = box.getBoundingClientRect();
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.min(Math.max(r.left - b.left + r.width / 2, half), b.width - half) + 'px';
      tip.style.top = (r.top - b.top) + 'px';
    };
    box.querySelectorAll('.bar').forEach((g) => { g.addEventListener('pointerenter', () => show(g)); g.addEventListener('focus', () => show(g)); g.addEventListener('pointerleave', () => { tip.hidden = true; }); g.addEventListener('blur', () => { tip.hidden = true; }); });
  }
  // History drawer
  const resIcon = (r, v) => (r === 'ok' ? `<span class="res ok">✓ ${v}</span>` : r === 'bad' ? `<span class="res bad">✗ ${v}</span>` : `<span class="res run">running ${v}</span>`);
  function drawerBody() {
    const a = state.agent, failed = a.h.filter((x) => x[3] === 'bad');
    const tabs = [['did', 'What it did', a.h.length], ['failed', 'Failed', failed.length], ...(a.tl ? [['tasks', 'Tasks', `${a.tl.filter((t) => t[0] === 'done').length}/${a.tl.length}`]] : [])];
    if (!tabs.some((t) => t[0] === state.tab)) state.tab = 'did';
    $('#d-tabs').innerHTML = tabs.map(([k, l, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === state.tab}">${l} <span class="n">${n}</span></button>`).join('');
    const rows = (list) => list.map(([t, tool, target, r, v]) => `<div class="p-ev"><span class="t">${t}</span><span class="tool">${esc(tool)}</span><span class="target">${esc(target)}</span>${resIcon(r, esc(v))}</div>`).join('');
    const body = state.tab === 'did' ? rows([...a.h].reverse()) : state.tab === 'failed' ? (failed.length ? rows(failed) : '<div class="p-empty"><b>Nothing failed</b></div>')
      : `<div style="padding:4px 20px"><ul class="p-tasklist">${a.tl.map(([st, l]) => `<li class="${st === 'done' ? 'done' : st === 'run' ? 'now' : ''}"><span class="mk">${st === 'done' ? '✓' : st === 'run' ? '●' : '○'}</span><span>${esc(l)}</span></li>`).join('')}</ul></div>`;
    $('#d-body').innerHTML = body + '<div class="p-notice note2"><span class="i">i</span><p><b>Content is off.</b> This shows tools, files and timings. Set <code>content: full</code> in the plugin to also see prompts, answers and thinking.</p></div>';
  }
  function openAgent(id, from) {
    state.agent = AGENTS[id]; state.tab = 'did'; state.opener = from;
    const a = state.agent;
    $('#d-head').innerHTML = `<div class="r1">${av(a.name[0].toUpperCase(), a.m)}<h3 id="d-name">${esc(a.name)}</h3>${pill(a.st)}<button type="button" class="p-x" id="d-close" aria-label="Close the history">×</button></div><div class="p-facts"><span>${a.role}</span>${model(a.m)}<span>${a.session.project}</span>${a.facts.map((f) => `<span>${f}</span>`).join('')}<span class="num">${tok(a.tok)} tok</span><span class="num">${usd(a.cost)}</span></div>`;
    drawerBody();
    document.querySelectorAll('[data-agent].agent').forEach((r) => r.setAttribute('aria-expanded', String(r.dataset.agent === id)));
    $('#drawer').hidden = false; $('#scrim').hidden = false; $('#d-close').focus();
  }
  function closeAgent() {
    $('#drawer').hidden = true; $('#scrim').hidden = true;
    document.querySelectorAll('.agent').forEach((r) => r.setAttribute('aria-expanded', 'false'));
    if (state.opener && document.contains(state.opener)) state.opener.focus();
  }
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('#d-close') || t.closest('#scrim')) return closeAgent();
    const tab = t.closest('[data-tab]'); if (tab) { state.tab = tab.dataset.tab; return drawerBody(); }
    const ag = t.closest('[data-agent]'); if (ag) return openAgent(ag.dataset.agent, ag);
    const go = t.closest('[data-go]'); if (go) { e.preventDefault(); state.board = { pipeline: 'roles' }[go.dataset.go] || go.dataset.go; return render(); }
    const bd = t.closest('[data-board]'); if (bd) { state.board = bd.dataset.board; return render(); }
    const role = t.closest('[data-role]'); if (role) { state.role = role.dataset.role; return render(); }
    const save = t.closest('.fix .p-btn'); if (save) { save.nextElementSibling.hidden = false; }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#drawer').hidden) return closeAgent();
    const r = e.target.closest && e.target.closest('[data-agent][role="button"]');
    if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openAgent(r.dataset.agent, r); }
  });
  const seg = (id, f) => $(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); f(b.dataset.v); });
  seg('#rv-page', (v) => { state.board = v; render(); });
  seg('#rv-theme', (v) => (v === 'system' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', v)));
  seg('#rv-width', (v) => $('#stage').classList.toggle('phone', v === 'phone'));
  seg('#rv-key', (v) => { state.key = v === 'key'; render(); });
  const h = location.hash.slice(1); if (RENDER[h]) state.board = h;
  render();
})();
</script>
