<style>/* Proposed studio library, scoped to .prop. Tokens are the approved Live v3 language (design/live-v3.html). */
.prop {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .prop {

  --ink: #e9eaf4; --muted: #a3a6c0; --faint: #74778f;
  --accent: #9c9aff; --accent-soft: #24244a; --accent-ink: #c2c1ff; --on-accent: #0e0f17;
  --data: #8c93b8; --data-soft: #23263a;
  --ok: #56d48f; --ok-bg: #11301f; --ok-dot: #3fc47c;
  --wait: #f2bd4d; --wait-bg: #36290b; --wait-dot: #e6a823;

  --done: #a3a6c0; --done-bg: #212334; --done-dot: #6b6e86;
  --opus: #cf62bd; --sonnet: #5f92f2; --haiku: #18a690;
  --shadow: none; --pop: 0 8px 28px rgba(0, 0, 0, .5); } }
:root[data-theme="dark"] .prop {

  --accent: #9c9aff; --accent-soft: #24244a; --accent-ink: #c2c1ff; --on-accent: #0e0f17;
  --data: #8c93b8; --data-soft: #23263a;
  --ok: #56d48f; --ok-bg: #11301f; --ok-dot: #3fc47c;

.prop *, .prop *::before, .prop *::after { box-sizing: border-box; }

/* Shell */

.prop .p-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 14px/1 var(--sans); cursor: pointer; text-decoration: none; }

.prop .p-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--line-strong); font-weight: 600; box-shadow: var(--shadow); }

/* Fields */
.prop .p-field { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.prop .p-select, .prop .p-input { min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-strong); background-color: var(--surface); color: var(--ink); font: 400 14px/1 var(--sans); }
.prop .p-select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.prop .p-input.money { font-family: var(--mono); width: 120px; }
.prop .p-select:focus, .prop .p-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

.prop .p-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.prop .p-card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.prop .p-card-h h3 { margin: 0; font: 600 15px/1.3 var(--sans); }
.prop .p-card-h .p-hint { font-size: 13px; color: var(--muted); }
.prop .p-card-b { padding: 16px 20px; }

/* State pill, model tag, chips */

.prop .s-working { --c-dot: var(--ok-dot); color: var(--ok); background: var(--ok-bg); }
.prop .s-waiting { --c-dot: var(--wait-dot); color: var(--wait); background: var(--wait-bg); }
.prop .s-stalled, .prop .s-error { --c-dot: var(--bad-dot); color: var(--bad); background: var(--bad-bg); }
.prop .s-done { --c-dot: var(--done-dot); color: var(--done); background: var(--done-bg); }
.prop .p-model { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; }
.prop .p-model::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--m); }
.prop .m-opus { --m: var(--opus); } .prop .m-sonnet { --m: var(--sonnet); } .prop .m-haiku { --m: var(--haiku); }
.prop .p-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 7px; background: var(--sunk); border: 1px solid var(--line); color: var(--ink); font-size: 13px; white-space: nowrap; }

.prop .p-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.prop .p-tabs .n { font: 500 12px/1 var(--mono); padding: 3px 6px; border-radius: 999px; background: var(--sunk); }

.prop .p-tablewrap { overflow-x: auto; }

.prop .p-table .r { text-align: right; }
.prop .p-table .num { font-size: 14px; }
.prop .p-table .sub { display: block; font-size: 13px; color: var(--muted); }

.prop .p-meter { display: grid; gap: 6px; min-width: 120px; }

.prop .p-track { height: 6px; border-radius: 3px; background: var(--data-soft); overflow: hidden; }
.prop .p-track i { display: block; height: 100%; border-radius: 3px; background: var(--data); }
.prop .p-track.warn i { background: var(--wait-dot); }
.prop .p-track.ok i { background: var(--ok-dot); }
.prop .p-track.m-opus i { background: var(--opus); } .prop .p-track.m-sonnet i { background: var(--sonnet); } .prop .p-track.m-haiku i { background: var(--haiku); }

.prop .p-av { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; font: 600 13px/1 var(--sans); color: #fff; background: var(--m, var(--data)); flex: none; }

.prop .p-stat .k { font-size: 12px; font-weight: 500; color: var(--muted); }
.prop .p-stat .v { font: 500 22px/1.1 var(--mono); font-variant-numeric: tabular-nums; }

.prop .p-notice { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); font-size: 14px; }

.prop .p-notice.warn { background: var(--wait-bg); border-color: transparent; color: var(--wait); }
.prop .p-notice.warn .i { background: var(--wait-dot); color: #fff; }
.prop .p-notice.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.prop .p-notice.bad .i { background: var(--bad-dot); color: #fff; }

/* Tooltip */
.prop .p-tip { display: inline-grid; gap: 4px; max-width: 280px; padding: 9px 12px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: var(--pop); }

.prop .p-skel { display: grid; gap: 10px; padding: 16px 20px; }

@media (prefers-reduced-motion: no-preference) {

}
@keyframes p-shimmer { to { background-position: -200% 0; } }

/* Drawer */
.prop .p-drawer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px 0 0 14px; box-shadow: var(--pop); display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }

.prop .p-ev { display: grid; grid-template-columns: 64px 72px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 14px; }

<style>/* Page layouts for the studio mocks, on top of prop.css (the approved library). Phone = the app's own width <= 720px. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--rv-bg); color: var(--rv-ink); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
:root { --rv-bg: #e9e9f1; --rv-ink: #15162a; --rv-muted: #585b73; --rv-line: #cfd1de; --rv-surface: #ffffff; --rv-accent: #4f4bd0; --rv-on: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rv-bg: #08090f; --rv-ink: #e9eaf4; --rv-muted: #a3a6c0; --rv-line: #34374d; --rv-surface: #161826; --rv-accent: #9c9aff; --rv-on: #0e0f17; color-scheme: dark; } }
:root[data-theme="dark"] { --rv-bg: #08090f; --rv-ink: #e9eaf4; --rv-muted: #a3a6c0; --rv-line: #34374d; --rv-surface: #161826; --rv-accent: #9c9aff; --rv-on: #0e0f17; color-scheme: dark; }

/* Review bar: not part of the app */
.rv { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px dashed var(--rv-line); font-size: 13px; color: var(--rv-muted); }
.rv b { color: var(--rv-ink); font-weight: 600; }
.rv-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rv-line); border-radius: 8px; overflow: hidden; }
.rv-seg button { border: 0; background: var(--rv-surface); color: var(--rv-ink); padding: 6px 11px; min-height: 32px; font: inherit; cursor: pointer; }
.rv-seg button + button { border-left: 1px solid var(--rv-line); }
.rv-seg button[aria-pressed="true"] { background: var(--rv-accent); color: var(--rv-on); }
.stage.phone { padding-block: 24px; }
.stage.phone .app { width: 390px; margin: 0 auto; border: 1px solid var(--rv-line); border-radius: 22px; overflow: hidden; min-height: 820px; }
.decide { max-width: 1280px; margin: 0 auto; padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.decide h2 { margin: 0 0 8px; font: 700 20px/1.2 "Bricolage Grotesque", system-ui, sans-serif; color: var(--rv-ink); }
.decide ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 100ch; color: var(--rv-ink); font-size: 14px; }
.decide code { font-family: "IBM Plex Mono", monospace; font-size: 13px; }

/* App shell */
.app { container: app / inline-size; position: relative; min-height: 100vh; }
.app .p-top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app .p-nav a { cursor: pointer; }
.app .menu { display: none; }
.app .page { max-width: 1280px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.app .page > * { min-width: 0; }
.app .hrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.app .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.app .foot { font-size: 13px; color: var(--faint); }
.app .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.app .grid2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.app .stack { display: grid; gap: 16px; align-content: start; }

/* Live (the approved v3 rows) */
.app .needs .need { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px 16px; padding: 12px 20px; border-top: 1px solid var(--line); }
.app .needs .need:first-of-type { border-top: 0; }

<section class="decide" id="decide" aria-live="polite"></section>
<script>(() => {
  const $ = (s) => document.querySelector(s);
  const real = '<span class="real">real</span>', ex = '<span class="tag">example</span>', yours = '<span class="tag">yours</span>';
  const usd = (v) => `$${Math.round(v).toLocaleString('en-US')}`;

  /* ---------- Worth (Ledger · Worth): October, mobile-app ---------- */
  const SIZES = [['S', 0.5], ['M', 2], ['L', 6], ['XL', 16]];
  // Example sizing of 64 of October's 109 merged PRs: S 30, M 22, L 10, XL 2.
  const SIZED = { S: 30, M: 22, L: 10, XL: 2 };
  const byHand = SIZES.reduce((t, [k, h]) => t + SIZED[k] * h, 0); // 151 h
  const attention = 28.1, rate = 90, planUsd = 200, api = 2055;
  const PRS = [
    [141, '25 Oct', '+1,146 −56', 'feat(sync): offline edits sync when the phone is back online, with a screen for conflicts', '2 sessions · 7 agents', 'L'],
    [140, '25 Oct', '+1,747 −96', 'feat(push): reminders arrive as notifications and open the screen they are about', '1 session · 5 agents', 'L'],
    [139, '24 Oct', '+2,747 −170', 'feat(maps): a saved place shows its photos, notes and visits', '1 session · 6 agents', null],
    [138, '24 Oct', '+1,776 −29', 'feat(auth): sign in with a passkey that works on every device', '1 session · 6 agents', null],
    [136, '23 Oct', '+704 −0', 'feat(search): the search page shows recent places before you type', '1 session · 4 agents', 'M'],
    [125, '22 Oct', '+145 −6', 'fix(api): the API refuses uploads into a deleted album', '1 session · 3 agents', 'S'],
  ];
  function head(view, sub) {
    return `<div class="hrow"><div class="p-head"><h1>Ledger</h1><span class="p-sub">${sub}</span></div>
      <div class="filters"><span class="p-seg" role="group" aria-label="Ledger view"><button type="button" aria-pressed="false">Totals</button><button type="button" aria-pressed="false">Trends</button><button type="button" aria-pressed="${view === 'worth'}">Worth</button></span>
      <select class="p-select" aria-label="Project"><option>mobile-app</option></select>
      <span class="p-seg" role="group" aria-label="Period"><button type="button" aria-pressed="true">Month</button><button type="button" aria-pressed="false">Week</button></span></div></div>`;
  }
  function worth() {
    const net = byHand - attention, value = net * rate;
    return `${head('worth', 'mobile-app · October so far · your estimates beside what the logs measured')}
    <section class="p-card"><div class="p-card-h"><h3>Your numbers</h3><span class="p-hint">only you know these; they stay on this machine</span></div><div class="p-card-b" style="display:grid;gap:14px">
      <div class="settings"><label for="rate">Your hourly rate<input id="rate" class="p-input" value="$${rate}"></label><label for="planp">Your plan, a month<input id="planp" class="p-input" value="$${planUsd}"></label><button type="button" class="p-btn">Save</button></div>
      <div class="sizes">One tap per merged PR: ${SIZES.map(([k, h]) => `<span><b>${k}</b> ${h} h</span>`).join('·')} <button type="button" class="p-btn" style="margin-left:6px">Edit Sizes</button></div>
    </div></section>
    <section class="p-card"><div class="p-card-h"><h3>October so far</h3><span class="p-hint">a losing month shows negative</span></div><div class="p-card-b" style="display:grid;gap:14px">
      <div class="stats6">
        <div class="p-stat"><span class="k">Hours by hand ${yours}</span><span class="v">${byHand} h</span><span class="d">64 of 109 merged PRs sized</span></div>
        <div class="p-stat"><span class="k">Your attention ${real}</span><span class="v">${attention} h</span><span class="d">473 prompts on 21 days, plus permission waits</span></div>
        <div class="p-stat"><span class="k">Net hours</span><span class="v">${Math.round(net)} h</span><span class="d">by hand minus attention</span></div>
        <div class="p-stat"><span class="k">Value</span><span class="v">${usd(value)}</span><span class="d">at your ${usd(rate)} an hour</span></div>
        <div class="p-stat"><span class="k">You paid</span><span class="v">${usd(planUsd)}</span><span class="d">your plan · ${usd(api)} API-equivalent ${real}</span></div>
        <div class="p-stat"><span class="k">Return</span><span class="v">${usd(value - planUsd)}</span><span class="d">value minus what you paid</span></div>
      </div>
      <pre class="formula">value  = (hours by hand − hours of your attention) × your rate
return = value − what you paid</pre>
    </div></section>
    <section class="p-card"><div class="p-card-h"><h3>Merged PRs to size</h3><span class="p-hint">45 of 109 not sized yet · newest first</span></div><div class="prs">
      ${PRS.map(([n, d, lines, t, who, s]) => `<div class="pr"><span class="n">#${n}</span><span class="t"><b>${t}</b><small>merged ${d} · ${lines} · ${who}</small></span><span class="p-seg" role="group" aria-label="Size of #${n}">${SIZES.map(([k]) => `<button type="button" aria-pressed="${k === s}">${k}</button>`).join('')}<button type="button" aria-pressed="false">Skip</button></span></div>`).join('')}
    </div>
    <details class="p-explain"><summary>How Worth is counted</summary><p>Hours by hand are yours: a size per merged PR, which you can change at any time. Your attention comes from the gaps between your prompts (under 10 minutes counts as working, plus 2 minutes per prompt) and your permission waits, so it's a floor: reading a diff afterwards leaves no trace. A PR finds its sessions through the PR links Claude Code records (156 of mobile-app's 171 merged PRs have one). Work that never became a PR can be sized as a session. Nothing asks you for a size when a session ends. Self-estimates run optimistic: in METR's 2025 trial, developers were 19% slower with AI and believed they were 20% faster.</p></details></section>
    <p class="foot">Real: attention, spend, PR titles and sizes. Example: your rate, your plan, the sizes chosen, how many PRs are sized, and the sessions and agents per PR.</p>`;
  }

  /* ---------- Unbacked claims (Live) ---------- */
  function truth() {
    const rows = [
      ['main', 'orchestrator', 'opus', 'working', 'Waiting on reviewer', 'Agent 1m 20s'],
      ['implementer', 'developer', 'sonnet', 'done', 'Fixed the quarter totals in plan.ts', 'done in 6m 02s'],
      ['reviewer', 'reviewer', 'opus', 'claim', 'Said "all 48 tests pass"', 'no test ran after its last code edit, at 14:02'],
    ];
    const pill = { working: '<span class="p-state s-working">working</span>', done: '<span class="p-state s-done">done</span>', claim: '<span class="p-state s-claim">unbacked claim</span>' };
    return `<div class="p-head"><h1>1 session running</h1><div class="p-tally"><span style="--c-dot:var(--ok-dot)">1 at work</span><span style="--c-dot:var(--bad-dot)">1 unbacked claim</span><span style="--c-dot:var(--done-dot)">1 done</span></div></div>
    <section class="p-card needs" aria-labelledby="needs-h"><div class="p-card-h"><h3 id="needs-h">Needs you</h3><span class="p-hint">1 agent</span></div>
      <div class="need">${pill.claim}<span><b>reviewer</b> in <b>mobile-app</b> said all 48 tests pass; no test ran after its last code edit, at 14:02 ${ex}</span><span class="since num">40s</span><button type="button" class="p-btn">Open</button></div>
    </section>
    <section class="p-card" aria-label="mobile-app">
      <div class="shead"><div class="who"><div class="l1"><h2>mobile-app</h2><span class="p-chip branch">fix/upload-retries</span></div><span class="meta">mbp · started 13:41 · running 22m</span></div></div>
      <div class="cols" aria-hidden="true"><span>Agent</span><span>Doing now</span><span>Model</span><span class="r">Tokens</span><span class="r">Cost</span><span class="r">State</span></div>
      ${rows.map(([n, role, m, st, what, sub], i) => `<div class="agent d${i ? 1 : 0} is-${st}" role="button" tabindex="0"><span class="name"><span class="p-av" style="--m:var(--${m})" aria-hidden="true">${n[0].toUpperCase()}</span><span><b>${n}</b><small>${role}</small></span></span><span class="doing"><span class="what">${what}</span><span class="sub"><span>${sub}</span></span></span><span class="m"><span class="p-model m-${m}">${m[0].toUpperCase() + m.slice(1)} 5.5</span></span><span class="tok r num">${['1.2M', '640k', '310k'][i]}</span><span class="cost r num">${['$1.31', '$0.38', '$0.52'][i]}</span><span class="facts"></span>${pill[st]}</div>`).join('')}
    </section>
    <section class="p-card"><div class="p-card-h"><h3>reviewer · what it did</h3><span class="p-hint">the history drawer, with the checks marked ${ex}</span></div><div class="marks">
      <div class="mark"><span class="t">13:58</span><span class="k ok">test run · ok</span><span class="w">pnpm test, 1,412 passed</span></div>
      <div class="mark"><span class="t">14:00</span><span class="k bad">path not found</span><span class="w">Read src/lib/backend/firestore-admin.ts: no such file</span></div>
      <div class="mark"><span class="t">14:01</span><span class="k bad">edit missed</span><span class="w">Edit src/lib/plan.ts: the text to replace wasn't in the file</span></div>
      <div class="mark"><span class="t">14:02</span><span class="k">Edit</span><span class="w">src/lib/plan.ts</span></div>
      <div class="mark"><span class="t">14:02</span><span class="k">Write</span><span class="w">notes/review.md: a note, not code, so it doesn't count</span></div>
      <div class="mark"><span class="t">14:03</span><span class="k bad">unbacked claim</span><span class="w">"all 48 tests pass": the last test run (13:58) came before the code edit at 14:02</span></div>
    </div>
    <details class="p-explain"><summary>How claims are checked</summary><p>With Content on full, an agent's final answer and every subagent's report are read for test, build and edit claims. Each one is checked against that agent's own calls: a test run after its last edit to code or tests, whether it passed, a write to the file it names. Edits to notes, PR bodies and memory files don't count; in mobile-app's history both flags were exactly that. Without content, the error and command classes still mark missing paths, missed edits and tests edited right after a failure. Drift from the task needs a reader, so it goes to Analysis v2.</p></details></section>
    <p class="foot">mobile-app, 10 weeks ${real}: 106 final answers or reports claimed tests pass. 0 were unbacked once edits to notes and PR bodies are left out (2 flagged before, both edits to a note or a PR body). 62 paths that didn't exist, 22 missed edits, 19 tests edited right after a failing run.</p>`;
  }

  /* ---------- Failure patterns (Analysis · Patterns) ---------- */
  function ahead(view, sub) {
    return `<div class="hrow"><div class="p-head"><h1>Analysis</h1><span class="p-sub">${sub}</span></div>
      <div class="filters"><span class="p-seg" role="group" aria-label="Analysis view"><button type="button" data-board="patterns" aria-pressed="${view === 'patterns'}">Patterns</button><button type="button" data-board="search" aria-pressed="${view === 'search'}">Search</button><button type="button" data-board="analysis" aria-pressed="${view === 'analysis'}">Reports</button></span>
      <select class="p-select" aria-label="Project"><option>mobile-app</option></select></div></div>`;
  }
  const KINDS = [
    ['A command failed', 925, [['other commands', 637], ['tests', 90], ['gh', 61], ['git', 53], ['docker', 38], ['builds', 35], ['lint', 9], ['installs', 2]]],
    ['A path that doesn\'t exist', 62], ['A timeout', 53], ['Refused (permission or the auto-mode classifier)', 35], ['An edit whose text wasn\'t in the file', 22], ['Written before it was read', 7], ['Invalid input', 4], ['A command that doesn\'t exist', 4],
  ];
  function patterns() {
    const max = 925;
    const row = (k, n, sub) => `<tr class="${sub ? 'sub' : ''}"><td>${k}</td><td class="r">${n.toLocaleString('en-US')}</td><td style="width:40%"><span class="bar" style="width:${Math.max(2, (n / max) * 100)}%"></span></td></tr>`;
    return `${ahead('patterns', 'mobile-app · 10 weeks · from the plugin and the imported logs')}
    <section class="p-card"><div class="p-card-b"><div class="stats6">
      <div class="p-stat"><span class="k">Failed calls ${real}</span><span class="v">1,136</span><span class="d">of 46,473 (2.4%)</span></div>
      <div class="p-stat"><span class="k">Paths that didn't exist</span><span class="v">62</span><span class="d">invented or stale</span></div>
      <div class="p-stat"><span class="k">Missed edits</span><span class="v">22</span><span class="d">the text wasn't in the file</span></div>
      <div class="p-stat"><span class="k">Tests edited after a failure</span><span class="v">19</span><span class="d">worth a look, often fine</span></div>
      <div class="p-stat"><span class="k">Unbacked claims</span><span class="v">0</span><span class="d">of 106 test claims</span></div>
    </div></div></section>
    <section class="p-card"><div class="p-card-h"><h3>The same failure, again and again</h3><span class="p-hint">grouped across sessions; each points to a rule worth changing ${real}</span></div>
      <div class="repeat"><div><b>Polling with sleep, blocked</b><p>Agents waited with <code>sleep</code> then <code>cat</code> or <code>tail</code>; Claude Code blocks it.</p></div><span class="num">155 · 4 sessions</span><span class="try">Try: a line in the agents' brief to run long jobs in the background and wait for the notification.</span></div>
      <div class="repeat"><div><b>Edits stopped by the repo's own hook</b><p>A PreToolUse hook refused Write and Edit calls.</p></div><span class="num">63 · 5 sessions</span><span class="try">Try: tell agents which files and branches the hook protects, before they start.</span></div>
      <div class="repeat"><div><b>Outside the worktree</b><p>An agent isolated in a worktree reached for a path outside it.</p></div><span class="num">50 · 1 session</span><span class="try">Try: say in the brief that the worktree is the only place it can write.</span></div>
      <div class="repeat"><div><b>gh edit on a Projects (classic) repo</b><p><code>gh issue edit</code> and <code>gh pr edit</code> fail with a GraphQL deprecation error.</p></div><span class="num">13 · 3 sessions</span><span class="try">Your rules already say: use <code>gh api -X PATCH</code>. Some briefs don't carry it.</span></div>
    </section>
    <section class="p-card"><div class="p-card-h"><h3>Failed calls by kind</h3><span class="p-hint">the error and command classes from the plugin (#43) ${real}</span></div><div class="p-tablewrap"><table class="kinds">
      <thead><tr><th>Kind</th><th class="r">Calls</th><th></th></tr></thead><tbody>
      ${KINDS.map(([k, n, subs]) => row(k, n) + (subs ? subs.map(([s, m]) => row(s, m, true)).join('') : '')).join('')}
    </tbody></table></div>
    <details class="p-explain"><summary>How patterns are found</summary><p>Each failed call gets a short class from the plugin (a path not found, an edit that missed, a command that failed, and the kind of command), so no output text has to leave the machine. Repeats are failures of the same shape across sessions, with paths and numbers set aside. With Content on full, the group can also show the failing text.</p></details></section>`;
  }

  /* ---------- Search (Analysis · Search) ---------- */
  function search() {
    const hits = [
      ['answer', 'implementer', '20 Oct · session 7d21', 'The emulator suite now reads its hosts from one setting, and it refuses to <mark>wipe</mark> an emulator that isn\'t a throwaway.'],
      ['thinking', 'main', '19 Oct · session b738', 'If the guard only checks the Firestore host, the Auth emulator can still be <mark>wiped</mark>; check both.'],
      ['tool output', 'test-runner', '19 Oct · session b738', 'emulator-guard.test.ts › refuses to <mark>wipe</mark> a non-empty emulator ✓'],
      ['prompt', 'you', '19 Oct · session b738', 'never <mark>wipe</mark> the shared emulator, it serves another project'],
    ];
    return `${ahead('search', 'mobile-app · captured text, from sessions with Content on full')}
    <section class="p-card"><div class="p-card-b" style="display:grid;gap:12px">
      <div class="search"><input class="p-input" id="q" aria-label="Search" value="wipe emulator"><button type="button" class="p-btn primary">Search</button></div>
      <div class="sizes"><span class="p-seg" role="group" aria-label="Kind"><button type="button" aria-pressed="true">All</button><button type="button" aria-pressed="false">Prompts</button><button type="button" aria-pressed="false">Answers</button><button type="button" aria-pressed="false">Thinking</button><button type="button" aria-pressed="false">Tool output</button></span></div>
    </div></section>
    <section class="p-card"><div class="p-card-h"><h3>4 results</h3><span class="p-hint">newest first · each opens its session ${ex}</span></div><div class="hits">
      ${hits.map(([kind, who, when, text]) => `<div class="hit"><div class="meta"><span class="p-chip">${kind}</span><span>${who}</span><span>${when}</span></div><p>${text}</p></div>`).join('')}
    </div>
    <details class="p-explain"><summary>What search covers</summary><p>Only text captured with Content on full: prompts, answers, thinking where Claude Code sends it, and tool input and output, masked and capped as stored. In mobile-app, 9 sessions were captured with content on. It runs on SQLite's full-text index on your machine.</p></details></section>`;
  }

  /* ---------- Analysis v2 (Analysis · Reports) ---------- */
  function analysis() {
    return `${ahead('analysis', 'mobile-app · run by hand, with an estimate first and a monthly cap')}
    <div class="grid2"><section class="p-card"><div class="p-card-h"><h3>New analysis</h3><span class="p-hint">nothing is sent until you confirm</span></div><div class="p-card-b" style="display:grid;gap:14px">
      <div class="settings"><label for="a1">This period<input id="a1" class="p-input" value="20–24 Oct" style="width:140px"></label><label for="a2">Against<input id="a2" class="p-input" value="13–19 Oct" style="width:140px"></label></div>
      <div class="sizes"><label class="p-check"><input type="checkbox" checked> Failures and their patterns</label><label class="p-check"><input type="checkbox" checked> Drift from the task (needs Content on full)</label></div>
      <div class="p-stat"><span class="k">Estimate ${ex}</span><span class="v">$0.84</span><span class="d">212k tokens in, measured · Opus 5.5 · $18.40 left of this month's $20 cap</span></div>
      <div><button type="button" class="p-btn primary">Confirm and Send</button></div>
    </div></section>
    <section class="p-card"><div class="p-card-h"><h3>Report · 20–24 Oct against 13–19 Oct</h3><span class="p-hint">${ex}</span></div>
      <div class="finding"><b>Spend fell 26% a day, mostly from generic agents</b><p>$104 a day before, $77 after; generic agents from $71 to $4.80. The main session is now most of the cost. ${real}</p></div>
      <div class="finding"><b>Drift: 3 of 41 turns did less than asked</b><p>Two skipped the README line the prompt asked for; one left a failing test marked as skipped.</p></div>
      <div class="finding"><b>The same failure 155 times: polling with sleep</b><p>Agents were told to wait for CI by hand. One line in the code skill's brief would stop it.</p></div>
      <div class="p-card-b" style="display:grid;gap:10px"><span class="p-hint">Proposed edit: you apply it, then the change shows up on Trends</span>
<pre class="diff">.claude/skills/code/SKILL.md
  ## Waiting on long jobs
<span class="d">- Poll until the suite finishes.</span>
<span class="a">+ Run long jobs in the background and wait for the notification:</span>
<span class="a">+ never sleep in a loop (Claude Code blocks it).</span></pre>
        <div><button type="button" class="p-btn">Copy the Diff</button></div></div>
    </section></div>`;
  }

  /* ---------- Thought bubbles (Office) ---------- */
  function office() {
    const bots = [['M', 'main', 'var(--opus)', 'Which PR should land first: the totals fix or the quarter labels?', 'thinking · 14:01'], ['I', 'implementer', 'var(--sonnet)', 'The test fails because the quarter starts in January, not on the contract date.', 'thinking · 14:01'], ['T', 'test-runner', 'var(--haiku)', 'Running the suite: 1,412 tests.', 'Bash · 14:02']];
    return `<div class="p-head"><h1>Office</h1><span class="p-sub">mobile-app · one room · thought bubbles</span></div>
    <section class="p-card"><div class="p-card-h"><h3>mobile-app</h3><span class="p-hint">a bubble shows each bot's latest thought, cut to one line ${ex}</span></div><div class="bots">
      ${bots.map(([l, n, c, t, s]) => `<div class="bot"><span class="face" style="background:${c}" aria-hidden="true">${l}</span><div><b style="font-weight:600">${n}</b><div class="bubble">${t}<small>${s}</small></div></div></div>`).join('')}
    </div>
    <details class="p-explain"><summary>When bubbles show</summary><p>Only in interactive sessions with thinking summaries on: Claude Code sends no thinking text to headless runs. Without it, a bubble shows the tool at work, as the Office does today.</p></details></section>`;
  }

  /* ---------- Plan and decisions ---------- */
  function plan() {
    return `<div class="p-head"><h1>v0.3</h1><span class="p-sub">The plan of 22 Oct, amended on 25 Oct with Worth and unbacked claims, checked against one project's real logs</span></div>
    <div class="grid2"><section class="p-card"><div class="p-card-h"><h3>What the data says</h3><span class="p-hint">mobile-app, 17 Aug to 24 Oct ${real}</span></div><div class="p-card-b"><ol class="facts-l">
      <li><b>One estimate per session doesn't fit.</b> 15 sessions, 8 of them across several feature branches. October alone merged 109 PRs.</li>
      <li><b>A PR finds its sessions.</b> Claude Code's own PR links name 156 of the 171 merged PRs; branch names alone match only 64.</li>
      <li><b>No real unbacked test claim yet.</b> 106 answers claimed tests pass. Both flags were edits to a note or a PR body, so the check must count only code and tests.</li>
      <li><b>The cheap checks find more.</b> 62 paths that didn't exist, 22 missed edits, 19 tests edited right after a failing run.</li>
      <li><b>Repeats point to rules.</b> 155 blocked sleeps, 63 edits stopped by a hook, 13 gh edits on Projects (classic).</li>
      <li><b>Your attention is measurable as a floor.</b> 473 prompts on 21 days in October: about 28 hours.</li>
    </ol></div></section>
    <section class="p-card"><div class="p-card-h"><h3>Slices</h3><span class="p-hint">the issues in GitHub, in this order</span></div><div class="p-card-b slices">
      <div class="slice"><span class="n">1</span><div><b>Error and command classes</b> (#43)<p>The plugin's classes; failure patterns read them. Works with Content off.</p></div></div>
      <div class="slice"><span class="n">2</span><div><b>Worth</b> (#42)<p>Your rate and plan, one-tap sizes per merged PR, the Worth view in the Ledger.</p></div></div>
      <div class="slice"><span class="n">3</span><div><b>Failure patterns</b> (#45)<p>Kinds, repeats and the counts, in Analysis.</p></div></div>
      <div class="slice"><span class="n">4</span><div><b>Unbacked claims</b> (#44)<p>Claims against calls, code and tests only, in Needs you and the history.</p></div></div>
      <div class="slice"><span class="n">5</span><div><b>Search</b> (#46), <b>Analysis v2</b> (#47), <b>thought bubbles</b> (#48)<p>The model-driven half, after the first four. This is where the split would cut.</p></div></div>
    </div></section></div>`;
  }

  const DECIDE = {
    worth: ['<b>One estimate per merged PR, as one tap on a size</b> (S, M, L, XL; their hours yours to set), with a session as the fallback for work that never became a PR. <i>Recommended: 109 PRs a month is too many to type hours for, and 15 sessions are too coarse.</i>',
      '<b>Your attention is a floor</b>: prompt windows under 10 minutes plus 2 minutes a prompt, plus permission waits. <i>Recommended.</i>',
      '<b>The return is computed on your plan price</b>, with the API-equivalent shown beside it. <i>Recommended: it\'s what you actually pay.</i>',
      '<b>Worth is a third Ledger view</b>, Totals | Trends | Worth. <i>Recommended.</i>',
      '<b>Revenue from your time log in another app waits</b> for a later version. <i>Recommended.</i>'],
    truth: ['<b>Only edits to code and tests break a claim</b>; notes, PR bodies and memory files don\'t. <i>Recommended: mobile-app\'s two flags were exactly those.</i>',
      '<b>Its word is "unbacked claim", in red</b> like a stall, its reason in the row; it goes in Needs you and the history. <i>Recommended.</i>',
      '<b>Without Content on full, a session says "not checked"</b>, never "clean". <i>Recommended.</i>',
      '<b>#44\'s done check changes</b>: a planted unbacked claim is caught, and mobile-app\'s history shows no false flags. <i>Recommended: the history has no real one to find.</i>'],
    patterns: ['<b>Analysis becomes the home of Explain</b>: Patterns | Search | Reports. <i>Recommended: the nav stays at five.</i>',
      '<b>Repeats come with a suggested fix</b>, a sentence you can act on, not a diff. <i>Recommended.</i>',
      '<b>Tests edited after a failure are "worth a look"</b>, not a flag. <i>Recommended: fixing a wrong test is often right.</i>'],
    search: ['<b>Search covers only captured text</b> and says how many sessions had Content on. <i>Recommended.</i>',
      '<b>Results open their session\'s history</b> at that moment. <i>Recommended.</i>'],
    analysis: ['<b>Analysis v2 compares two periods</b> and adds failures and drift, with the same estimate, confirm and cap as today. <i>Recommended.</i>',
      '<b>A proposed edit is a diff you copy and apply yourself.</b> agent-orb writes nothing to your repos. <i>Recommended.</i>'],
    office: ['<b>Bubbles show the latest thought, cut to one line</b>, and fall back to the tool at work when there is no thinking text. <i>Recommended.</i>'],
    plan: ['<b>Split v0.3</b>: v0.3 "Worth and truth" (#43, #42, #45, #44) and v0.4 "Explain" (#46, #47, #48), with Share moving to v0.5. <i>Recommended: the first four need no model and answer your two questions.</i>',
      '<b>Slice order 1 to 5</b> as listed. <i>Recommended.</i>'],
  };
  const TITLES = { worth: 'Worth', truth: 'unbacked claims', patterns: 'failure patterns', search: 'search', analysis: 'Analysis v2', office: 'thought bubbles', plan: 'plan' };
  const RENDER = { worth, truth, patterns, search, analysis, office, plan };
  const NAV = { worth: 'worth', truth: 'truth', patterns: 'patterns', search: 'patterns', analysis: 'patterns', office: 'office' };
  const state = { board: 'worth' };
  function render() {
    $('#page').innerHTML = RENDER[state.board]();
    document.querySelectorAll('.p-nav a').forEach((a) => a.toggleAttribute('aria-current', a.dataset.go === NAV[state.board]));
    document.querySelectorAll('.p-nav a[aria-current]').forEach((a) => a.setAttribute('aria-current', 'page'));
    document.querySelectorAll('#rv-page button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state.board)));
    $('#decide').innerHTML = `<h2>What the ${TITLES[state.board]} board decides</h2><ol>${DECIDE[state.board].map((d) => `<li>${d}</li>`).join('')}</ol>`;
  }
  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); state.board = go.dataset.go; return render(); }
    const bd = e.target.closest('[data-board]'); if (bd) { state.board = bd.dataset.board; return render(); }
  });
  const seg = (id, f) => $(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); f(b.dataset.v); });
  seg('#rv-page', (v) => { state.board = v; render(); });
  seg('#rv-theme', (v) => (v === 'system' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', v)));
  seg('#rv-width', (v) => $('#stage').classList.toggle('phone', v === 'phone'));
  const h = location.hash.slice(1); if (RENDER[h]) state.board = h;
  render();
})();
</script>
