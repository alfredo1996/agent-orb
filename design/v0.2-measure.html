<style>/* Proposed studio library, scoped to .prop. Tokens are the approved Live v3 language (design/live-v3.html). */
.prop {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .prop {
  --bg: #0e0f17; --surface: #161826; --sunk: #12131f; --line: #262839; --line-strong: #34374d;
  --ink: #e9eaf4; --muted: #a3a6c0; --faint: #74778f;
  --accent: #9c9aff; --accent-soft: #24244a; --accent-ink: #c2c1ff; --on-accent: #0e0f17;
  --data: #8c93b8; --data-soft: #23263a;
  --ok: #56d48f; --ok-bg: #11301f; --ok-dot: #3fc47c;
  --wait: #f2bd4d; --wait-bg: #36290b; --wait-dot: #e6a823;
  --bad: #ff8a8f; --bad-bg: #3b1518; --bad-dot: #f0545b;
  --done: #a3a6c0; --done-bg: #212334; --done-dot: #6b6e86;
  --opus: #cf62bd; --sonnet: #5f92f2; --haiku: #18a690;
  --shadow: none; --pop: 0 8px 28px rgba(0, 0, 0, .5); } }
:root[data-theme="dark"] .prop {

  --accent: #9c9aff; --accent-soft: #24244a; --accent-ink: #c2c1ff; --on-accent: #0e0f17;
  --data: #8c93b8; --data-soft: #23263a;
  --ok: #56d48f; --ok-bg: #11301f; --ok-dot: #3fc47c;

.prop *, .prop *::before, .prop *::after { box-sizing: border-box; }
.prop .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Shell */

.prop .p-tally span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c-dot); }

/* Buttons and links */
.prop .p-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 600 14px/1 var(--sans); cursor: pointer; text-decoration: none; }

.prop .p-btn[disabled] { background: var(--sunk); border-color: var(--line); color: var(--faint); cursor: not-allowed; filter: none; }

.prop .p-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--line-strong); font-weight: 600; box-shadow: var(--shadow); }

/* Fields */
.prop .p-field { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.prop .p-select, .prop .p-input { min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line-strong); background-color: var(--surface); color: var(--ink); font: 400 14px/1 var(--sans); }
.prop .p-select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.prop .p-input.money { font-family: var(--mono); width: 120px; }
.prop .p-select:focus, .prop .p-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

/* Card */
.prop .p-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.prop .p-card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.prop .p-card-h h3 { margin: 0; font: 600 15px/1.3 var(--sans); }
.prop .p-card-h .p-hint { font-size: 13px; color: var(--muted); }
.prop .p-card-b { padding: 16px 20px; }

/* State pill, model tag, chips */
.prop .p-state { display: inline-flex; align-items: center; gap: 7px; font: 600 13px/1 var(--sans); white-space: nowrap; padding: 6px 10px; border-radius: 999px; }
.prop .p-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c-dot); }
.prop .s-working { --c-dot: var(--ok-dot); color: var(--ok); background: var(--ok-bg); }
.prop .s-waiting { --c-dot: var(--wait-dot); color: var(--wait); background: var(--wait-bg); }
.prop .s-stalled, .prop .s-error { --c-dot: var(--bad-dot); color: var(--bad); background: var(--bad-bg); }
.prop .s-done { --c-dot: var(--done-dot); color: var(--done); background: var(--done-bg); }
.prop .p-model { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; }
.prop .p-model::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--m); }
.prop .m-opus { --m: var(--opus); } .prop .m-sonnet { --m: var(--sonnet); } .prop .m-haiku { --m: var(--haiku); }
.prop .p-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 7px; background: var(--sunk); border: 1px solid var(--line); color: var(--ink); font-size: 13px; white-space: nowrap; }

.prop .p-chip.branch { font-family: var(--mono); color: var(--muted); }
.prop .p-chip.warn { background: var(--wait-bg); border-color: transparent; color: var(--wait); }

.prop .p-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.prop .p-tabs .n { font: 500 12px/1 var(--mono); padding: 3px 6px; border-radius: 999px; background: var(--sunk); }

.prop .p-tablewrap { overflow-x: auto; }
.prop table.p-table { width: 100%; border-collapse: collapse; font-size: 14px; }

.prop .p-table tr:last-child td { border-bottom: 0; }
.prop .p-table .r { text-align: right; }
.prop .p-table .num { font-size: 14px; }
.prop .p-table .sub { display: block; font-size: 13px; color: var(--muted); }
.prop .p-table tbody tr:hover { background: var(--sunk); }

/* Meter and bars */
.prop .p-meter { display: grid; gap: 6px; min-width: 120px; }
.prop .p-meter .k { font-size: 12px; font-weight: 500; color: var(--muted); }
.prop .p-track { height: 6px; border-radius: 3px; background: var(--data-soft); overflow: hidden; }
.prop .p-track i { display: block; height: 100%; border-radius: 3px; background: var(--data); }
.prop .p-track.warn i { background: var(--wait-dot); }
.prop .p-track.ok i { background: var(--ok-dot); }
.prop .p-track.m-opus i { background: var(--opus); } .prop .p-track.m-sonnet i { background: var(--sonnet); } .prop .p-track.m-haiku i { background: var(--haiku); }

.prop .p-av { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; font: 600 13px/1 var(--sans); color: #fff; background: var(--m, var(--data)); flex: none; }

/* Stat */
.prop .p-stat { display: grid; gap: 2px; }
.prop .p-stat .k { font-size: 12px; font-weight: 500; color: var(--muted); }
.prop .p-stat .v { font: 500 22px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.prop .p-stat .d { font-size: 13px; color: var(--muted); }

/* Notice */
.prop .p-notice { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); font-size: 14px; }
.prop .p-notice .i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--sans); background: var(--line); color: var(--ink); }
.prop .p-notice p { margin: 0; }
.prop .p-notice code { font-family: var(--mono); font-size: 13px; }
.prop .p-notice.warn { background: var(--wait-bg); border-color: transparent; color: var(--wait); }
.prop .p-notice.warn .i { background: var(--wait-dot); color: #fff; }
.prop .p-notice.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.prop .p-notice.bad .i { background: var(--bad-dot); color: #fff; }

/* Tooltip */
.prop .p-tip { display: inline-grid; gap: 4px; max-width: 280px; padding: 9px 12px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 13px; box-shadow: var(--pop); }
.prop .p-tip b { font-weight: 600; }
.prop .p-tip .row { display: flex; justify-content: space-between; gap: 16px; font-family: var(--mono); }

/* Empty and loading */
.prop .p-empty { display: grid; gap: 6px; justify-items: start; padding: 20px; }
.prop .p-empty b { font-weight: 600; }
.prop .p-empty p { margin: 0; color: var(--muted); font-size: 14px; max-width: 52ch; }
.prop .p-skel { display: grid; gap: 10px; padding: 16px 20px; }
.prop .p-skel i { display: block; height: 12px; border-radius: 6px; background: var(--sunk); }
@media (prefers-reduced-motion: no-preference) {
  .prop .p-skel i { background: linear-gradient(90deg, var(--sunk) 0, var(--line) 50%, var(--sunk) 100%); background-size: 200% 100%; animation: p-shimmer 1.4s linear infinite; }
}
@keyframes p-shimmer { to { background-position: -200% 0; } }

/* Drawer */
.prop .p-drawer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px 0 0 14px; box-shadow: var(--pop); display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
.prop .p-dh { display: grid; gap: 8px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.prop .p-dh .r1 { display: flex; align-items: center; gap: 10px; }
.prop .p-dh h3 { margin: 0; font: 600 20px/1.2 var(--display); }
.prop .p-x { margin-left: auto; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 20px; cursor: pointer; }
.prop .p-facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }

/* Timeline */
.prop .p-ev { display: grid; grid-template-columns: 64px 72px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 20px; border-bottom: 1px solid var(--line); font-size: 14px; }
.prop .p-ev .t { font: 13px var(--mono); color: var(--faint); }
.prop .p-ev .tool { font: 500 13px var(--mono); }
.prop .p-ev .target { font: 13px var(--mono); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.prop .p-ev .res { font: 13px var(--mono); white-space: nowrap; }
.prop .ok { color: var(--ok); } .prop .bad { color: var(--bad); } .prop .run { color: var(--accent-ink); }

.prop details.p-explain { border-top: 1px solid var(--line); }
.prop details.p-explain summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; padding: 0 20px; font-size: 14px; font-weight: 500; color: var(--accent-ink); }
.prop details.p-explain p { margin: 0; padding: 0 20px 16px; font-size: 14px; color: var(--muted); max-width: 72ch; }

.prop .p-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.prop .p-legend span { display: inline-flex; align-items: center; gap: 7px; }
.prop .p-legend span::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--m); }

.prop .p-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; cursor: pointer; }
.prop .p-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }

.prop .p-tasklist .mk { font-family: var(--mono); color: var(--faint); }
.prop .p-tasklist .done .mk { color: var(--ok); } .prop .p-tasklist .now .mk { color: var(--accent-ink); }

<style>/* Page layouts for the studio mocks, on top of prop.css (the approved library). Phone = the app's own width <= 720px. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--rv-bg); color: var(--rv-ink); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
:root { --rv-bg: #e9e9f1; --rv-ink: #15162a; --rv-muted: #585b73; --rv-line: #cfd1de; --rv-surface: #ffffff; --rv-accent: #4f4bd0; --rv-on: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rv-bg: #08090f; --rv-ink: #e9eaf4; --rv-muted: #a3a6c0; --rv-line: #34374d; --rv-surface: #161826; --rv-accent: #9c9aff; --rv-on: #0e0f17; color-scheme: dark; } }
:root[data-theme="dark"] { --rv-bg: #08090f; --rv-ink: #e9eaf4; --rv-muted: #a3a6c0; --rv-line: #34374d; --rv-surface: #161826; --rv-accent: #9c9aff; --rv-on: #0e0f17; color-scheme: dark; }

/* Review bar: not part of the app */
.rv { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px dashed var(--rv-line); font-size: 13px; color: var(--rv-muted); }
.rv b { color: var(--rv-ink); font-weight: 600; }
.rv-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rv-line); border-radius: 8px; overflow: hidden; }
.rv-seg button { border: 0; background: var(--rv-surface); color: var(--rv-ink); padding: 6px 11px; min-height: 32px; font: inherit; cursor: pointer; }
.rv-seg button + button { border-left: 1px solid var(--rv-line); }
.rv-seg button[aria-pressed="true"] { background: var(--rv-accent); color: var(--rv-on); }
.stage.phone { padding-block: 24px; }
.stage.phone .app { width: 390px; margin: 0 auto; border: 1px solid var(--rv-line); border-radius: 22px; overflow: hidden; min-height: 820px; }
.decide { max-width: 1280px; margin: 0 auto; padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.decide h2 { margin: 0 0 8px; font: 700 20px/1.2 "Bricolage Grotesque", system-ui, sans-serif; color: var(--rv-ink); }
.decide ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 100ch; color: var(--rv-ink); font-size: 14px; }
.decide code { font-family: "IBM Plex Mono", monospace; font-size: 13px; }

/* App shell */
.app { container: app / inline-size; position: relative; min-height: 100vh; }
.app .p-top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app .p-nav a { cursor: pointer; }
.app .menu { display: none; }
.app .page { max-width: 1280px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.app .page > * { min-width: 0; }
.app .hrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.app .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.app .foot { font-size: 13px; color: var(--faint); }
.app .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.app .grid2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.app .stack { display: grid; gap: 16px; align-content: start; }

/* Live (the approved v3 rows) */
.app .needs .need { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px 16px; padding: 12px 20px; border-top: 1px solid var(--line); }
.app .needs .need:first-of-type { border-top: 0; }

    <nav class="p-nav" aria-label="Studio"><a href="#live" data-go="live">Live <span class="p-count" aria-label="2 sessions running">2</span></a><a href="#ledger" data-go="trends" aria-current="page">Ledger</a><a href="#pipeline" data-go="pipeline">Pipeline</a><a href="#office" data-go="office">Office</a><a href="#analysis" data-go="analysis">Analysis</a></nav>
    <span class="p-conn"><i></i>Live <span class="url">· 127.0.0.1:4040</span></span>

  <main class="page" id="page"></main>
</div></div>
<section class="decide" id="decide" aria-live="polite"></section>
<script>(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MODEL = { opus: 'Opus 5.5', sonnet: 'Sonnet 5.5', haiku: 'Haiku 5.5' };
  const model = (m) => `<span class="p-model m-${m}">${MODEL[m]}</span>`;
  const av = (letter, m) => `<span class="p-av" style="--m:var(--${m})" aria-hidden="true">${letter}</span>`;
  const usd = (v) => `$${Math.round(v).toLocaleString('en-US')}`;

  /* ---------- mobile-app, real: API-equivalent dollars per week (weeks start Monday, local time), from Claude Code's logs.
     who: main session, agents on a model of their own (an agent file or a built-in type), generic agents (general-purpose and
     workflow agents: no model of their own, so they inherit the main session's). Every total is the sum of its parts. ---------- */
  const WEEKS = [
    // label, main, typed, generic, opus, sonnet, haiku, other (Fable), tokens M, cache %, active days, prompts
    ['17 Aug', 332, 10, 36, 245, 0, 0, 133, 437, 97.7, 7, 111],
    ['24 Aug', 41, 0, 0, 41, 0, 0, 0, 57, 97.6, 5, 34],
    ['31 Aug', 99, 2, 0, 101, 0, 0, 0, 134, 96.3, 4, 20],
    ['7 Sep', 148, 0, 0, 148, 0, 0, 0, 231, 98.3, 5, 41],
    ['14 Sep', 45, 0, 86, 131, 0, 0, 0, 111, 93.0, 3, 21],
    ['21 Sep', 76, 0, 363, 439, 0, 0, 0, 913, 95.7, 5, 67],
    ['28 Sep', 84, 0, 198, 282, 0, 0, 0, 664, 95.9, 5, 59],
    ['5 Oct', 101, 0, 562, 663, 0, 0, 0, 1771, 96.8, 6, 71],
    ['12 Oct', 194, 0, 548, 690, 49, 3, 0, 2307, 96.8, 7, 171],
    ['19 Oct', 377, 27, 41, 398, 45, 2, 0, 1347, 96.9, 6, 205],
  ].map(([w, main, typed, generic, opus, sonnet, haiku, other, tokM, cache, days, prompts]) => ({ w, main, typed, generic, opus, sonnet, haiku, other, tokM, cache, days, prompts }));
  const WHO = [['main', 'Main session', 'var(--data)'], ['typed', 'Agents on their own model', 'var(--ok-dot)'], ['generic', 'Generic agents, no model of their own', 'var(--wait-dot)']];
  const BYMODEL = [['opus', 'Opus', 'var(--opus)'], ['sonnet', 'Sonnet', 'var(--sonnet)'], ['haiku', 'Haiku', 'var(--haiku)'], ['other', 'Fable', 'var(--data-soft)']];
  const MARKERS = [
    { n: 1, week: 8, dayFrac: 4.5 / 7, date: '16 Oct', title: 'The agents arrive',
      files: [['.claude/agents/implementer.md', 'added, model: sonnet'], ['.claude/agents/adversarial-reviewer.md', 'added, model: opus'], ['.claude/agents/test-runner.md', 'added, model: haiku'], ['.claude/skills/code/SKILL.md', 'and 5 more skill files']],
      source: 'mobile-app commit c3f9a2e, 16 Oct 02:11', count: '9 files',
      note: 'Agents on their own model cost <b>$0</b> from 16 to 19 Oct: added, not yet used. Generic agents went on at $14–90 a day.',
      ba: null },
    { n: 2, week: 9, dayFrac: 1.5 / 7, date: '20 Oct', title: 'Issues run through the agents by type',
      files: [['.claude/skills/code/SKILL.md', '19 lines changed'], ['.claude/skills/release/SKILL.md', 'added'], ['.claude/skills/pr, review, test', '3 small edits'], ['~/.claude/rules/workflows.md', 'your rules, changed 20 Oct 20:35 (no history: fingerprint only)']],
      source: 'mobile-app commit 7c4d1e9, 20 Oct 20:37, and your rules the same evening', count: '5 files and your rules',
      note: 'The main session is now most of the cost: <b>$377 of $445</b> this week, nearly all of it Opus.',
      ba: [['API-equivalent a day', '$103', '$73', '−29%'], ['Generic agents a day', '$70', '$4', '−94%'], ['Agents on their own model a day', '$0', '$5', ''], ['Opus share of cost', '91%', '90%', '']] },
  ];
  const GOAL = { month: 'October', spent: 2029, goal: 2500, through: 24, days: 31 };

  const state = { board: 'trends', view: 'who', marker: 2 };

  /* ---------- Trends ---------- */
  function head(sub) {
    return `<div class="hrow"><div class="p-head"><h1>Ledger</h1><span class="p-sub">${sub}</span></div>
      <div class="filters"><span class="p-seg" role="group" aria-label="Ledger view"><button type="button" aria-pressed="false">Totals</button><button type="button" aria-pressed="true">Trends</button></span>
      <select class="p-select" aria-label="Project"><option>mobile-app</option><option>agent-orb</option><option>All projects</option></select>
      <span class="p-seg" role="group" aria-label="Period"><button type="button" aria-pressed="true">Week</button><button type="button" aria-pressed="false">Day</button></span></div></div>`;
  }
  const parts = () => (state.view === 'who' ? WHO : BYMODEL);
  const total = (w) => parts().reduce((s, [k]) => s + w[k], 0);
  function chart() {
    const W = 1000, H = 280, L = 56, R = 12, T = 40, B = 30, max = 800, bw = 44, n = WEEKS.length;
    const y = (v) => T + (H - T - B) * (1 - v / max), slot = (W - L - R) / n;
    let g = '<g class="grid">' + [0, 200, 400, 600, 800].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`).join('') + '</g>';
    g += '<g class="axis">' + [0, 200, 400, 600, 800].map((v) => `<text x="${L - 10}" y="${y(v) + 4}" text-anchor="end">${v ? '$' + v : '0'}</text>`).join('');
    g += WEEKS.map((w, i) => `<text x="${L + slot * i + slot / 2}" y="${H - 8}" text-anchor="middle">${w.w}</text>`).join('') + '</g>';
    MARKERS.forEach((m) => { const x = L + slot * m.week + slot * m.dayFrac; g += `<g class="mk" role="button" tabindex="0" data-marker="${m.n}" aria-pressed="${state.marker === m.n}" aria-label="Change ${m.n}, ${m.date}: ${m.title}"><line x1="${x}" x2="${x}" y1="${T - 12}" y2="${H - B}"/><circle cx="${x}" cy="${T - 24}" r="11"/><text x="${x}" y="${T - 20}" text-anchor="middle">${m.n}</text></g>`; }); // behind the bars and their totals
    WEEKS.forEach((w, i) => {
      const x = L + slot * i + (slot - bw) / 2; let acc = 0, segs = '';
      const ps = parts().filter(([k]) => w[k] > 0);
      ps.forEach(([k, , c], j) => { const v = w[k], y0 = y(acc + v), h = Math.max(y(acc) - y(acc + v) - (j < ps.length - 1 ? 2 : 0), 0); segs += `<rect x="${x}" y="${y0}" width="${bw}" height="${h}" rx="${j === ps.length - 1 ? 3 : 0}" style="fill:${c}"/>`; acc += v; });
      g += `<g class="bar" tabindex="0" data-i="${i}" aria-label="Week of ${w.w}: ${usd(total(w))}"><rect class="hit" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent"/>${segs}<text class="tot" x="${x + bw / 2}" y="${y(acc) - 6}" text-anchor="middle">${usd(acc)}</text></g>`;
    });
    const maxT = Math.max(...WEEKS.map(total));
    const rows = WEEKS.map((w, i) => {
      const mk = MARKERS.filter((m) => m.week === i).map((m) => `<div class="mkrow"><span class="mkdot">${m.n}</span><span>${m.date} · ${m.title}</span></div>`).join('');
      return `${mk}<div class="dayrow"><span class="dl">${w.w}</span><span class="stk" style="width:${(total(w) / maxT) * 100}%">${parts().filter(([k]) => w[k] > 0).map(([k, , c]) => `<i style="flex:${w[k]};background:${c}"></i>`).join('')}</span><span class="num">${usd(total(w))}</span></div>`;
    }).join('');
    return `<div class="daybars">${rows}</div><div class="chartbox" id="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="API-equivalent per week, mobile-app, with two changes marked">${g}</svg><div class="p-tip" id="ctip" hidden></div></div>`;
  }
  function markerCard() {
    const m = MARKERS.find((x) => x.n === state.marker);
    return `<section class="p-card" aria-labelledby="mk-h"><div class="p-card-h"><h3 id="mk-h">Change ${m.n} · ${m.date} · ${m.title}</h3><span class="p-hint">${m.source}</span></div>
      <div class="p-card-b" style="display:grid;gap:16px">
        <ul class="files">${m.files.map(([f, d]) => `<li><code>${esc(f)}</code> <span class="d">· ${d}</span></li>`).join('')}</ul>
        ${m.ba ? `<table class="ba"><thead><tr><th></th><th class="num">7 days before</th><th class="num">5 days after</th><th class="num"></th></tr></thead><tbody>${m.ba.map(([k, a, b, d]) => `<tr><td>${k}</td><td class="num">${a}</td><td class="num">${b}</td><td class="num ${d ? 'down' : ''}">${d}</td></tr>`).join('')}</tbody></table>` : ''}
        <p style="margin:0;font-size:14px">${m.note}</p>
      </div>
      <details class="p-explain"><summary>How a change is found and compared</summary><p>A change is a day the project's agents, skills or CLAUDE.md changed (from git for the past, from the plugin's fingerprint at each session start from now on), or your own CLAUDE.md and rules (fingerprint only). Before and after compare whole days on each side, up to 7, per active day so a quiet weekend doesn't count as a saving.</p></details></section>`;
  }
  function goalCard() {
    const pct = Math.round((100 * GOAL.spent) / GOAL.goal), pace = Math.round((GOAL.spent / GOAL.through) * GOAL.days);
    return `<section class="p-card"><div class="p-card-h"><h3>${GOAL.month} goal</h3><span class="p-hint">mobile-app · API-equivalent</span></div><div class="p-card-b goal">
      <span class="big">${usd(GOAL.spent)} <span style="color:var(--muted);font-size:15px">of ${usd(GOAL.goal)} · ${pct}%</span></span>
      <span class="p-track warn" role="img" aria-label="${pct}% of the goal; the status line warns from 80%"><i style="width:${pct}%"></i><span class="tick" aria-hidden="true"></span></span>
      <span class="row"><span>${GOAL.days - GOAL.through} days left</span><span>at this pace <b style="color:var(--ink)">${usd(pace)}</b> by 31 Oct</span><span>the status line warns from 80%</span></span>
      <div><button type="button" class="p-btn">Edit Goal</button></div></div></section>`;
  }
  function trends() {
    const a = WEEKS[9], b = WEEKS[8];
    const pd = (w) => total(w) / w.days, pp = (w) => total(w) / w.prompts, delta = (x, y) => `${x < y ? '−' : '+'}${Math.abs(Math.round((100 * (x - y)) / y))}%`;
    return `${head('mobile-app · 10 weeks · imported from Claude Code\'s logs, then the plugin')}
    <section class="p-card"><div class="p-card-b" style="display:flex;flex-wrap:wrap;gap:20px 44px">
      <div class="p-stat"><span class="k">A day, this week</span><span class="v">${usd(pd(a))}</span><span class="d">${usd(total(a))} over ${a.days} active days · ${delta(pd(a), pd(b))} on last week's ${usd(pd(b))}</span></div>
      <div class="p-stat"><span class="k">A prompt</span><span class="v">$${pp(a).toFixed(2)}</span><span class="d">${delta(pp(a), pp(b))} on last week's $${pp(b).toFixed(2)}</span></div>
      <div class="p-stat"><span class="k">Generic agents</span><span class="v">${Math.round((100 * a.generic) / (a.main + a.typed + a.generic))}%</span><span class="d">of cost; ${Math.round((100 * b.generic) / (b.main + b.typed + b.generic))}% last week</span></div>
      <div class="p-stat"><span class="k">Cache share</span><span class="v">${a.cache}%</span><span class="d">${b.cache}% last week</span></div>
    </div></section>
    <section class="p-card"><div class="p-card-h"><h3>API-equivalent per week</h3><span class="p-seg" role="group" aria-label="Split by"><button type="button" data-view="who" aria-pressed="${state.view === 'who'}">By who spent</button><button type="button" data-view="model" aria-pressed="${state.view === 'model'}">By model</button></span></div>
      ${chart()}
      <div style="padding:0 20px 14px"><div class="p-legend">${parts().map(([, l, c]) => `<span style="--m:${c}">${l}</span>`).join('')}</div></div>
      <div class="mklist">${MARKERS.map((m) => `<button type="button" class="mkbtn" data-marker="${m.n}" aria-pressed="${state.marker === m.n}"><span class="mkdot">${m.n}</span><span>${m.title}<br><small>${m.date} · ${m.count}</small></span><small>Compare</small></button>`).join('')}</div>
      <details class="tableview"><summary>Show as a table</summary><div class="p-tablewrap"><table class="p-table"><thead><tr><th>Week of</th>${parts().map(([, l]) => `<th class="r">${l.split(',')[0]}</th>`).join('')}<th class="r">Total</th><th class="r hide-phone">Tokens</th><th class="r hide-phone">Active days</th><th class="r hide-phone">Prompts</th></tr></thead><tbody>
        ${WEEKS.map((w) => `<tr><td>${w.w}</td>${parts().map(([k]) => `<td class="r num">${usd(w[k])}</td>`).join('')}<td class="r num"><b>${usd(total(w))}</b></td><td class="r num hide-phone">${w.tokM.toLocaleString('en-US')}M</td><td class="r num hide-phone">${w.days}</td><td class="r num hide-phone">${w.prompts}</td></tr>`).join('')}
      </tbody></table></div></details></section>
    <div class="grid2">${markerCard()}${goalCard()}</div>
    <p class="foot">Cost is API-equivalent: what these tokens would cost at list prices, not what a plan bills. The week of 19 Oct runs to today.</p>`;
  }
  function wireChart() {
    const box = $('#chartbox'); if (!box) return; const tip = $('#ctip');
    const show = (g) => {
      const w = WEEKS[+g.dataset.i];
      tip.innerHTML = `<b>Week of ${w.w} · ${usd(total(w))}</b>${parts().filter(([k]) => w[k] > 0).map(([k, l]) => `<span class="row"><span>${l.split(',')[0]}</span><span>${usd(w[k])}</span></span>`).join('')}<span class="row"><span>a prompt</span><span>$${(total(w) / w.prompts).toFixed(2)}</span></span>`;
      tip.hidden = false;
      const r = g.querySelector('rect:not(.hit)').getBoundingClientRect(), b = box.getBoundingClientRect(), half = tip.offsetWidth / 2;
      tip.style.left = Math.min(Math.max(r.left - b.left + r.width / 2, half), b.width - half) + 'px';
      tip.style.top = (r.top - b.top) + 'px';
    };
    box.querySelectorAll('.bar').forEach((g) => { g.addEventListener('pointerenter', () => show(g)); g.addEventListener('focus', () => show(g)); g.addEventListener('pointerleave', () => { tip.hidden = true; }); g.addEventListener('blur', () => { tip.hidden = true; }); });
  }

  /* ---------- Trends with no history ---------- */
  function noHistory() {
    return `${head('mobile-app · nothing recorded yet')}
    <section class="p-card"><div class="p-empty" style="gap:12px">
      <b>No history for mobile-app yet</b>
      <p>Claude Code keeps its own session logs on this Mac: <b>9 weeks for mobile-app</b> (20 Aug to today, 281 MB), and 3 more projects. Import them once and Trends starts with the past; the plugin carries on from there.</p>
      <pre class="cmd"><code>docker compose -f deploy/docker-compose.yml run --rm \\
  -v ~/.claude/projects:/import:ro orb-server import /import</code></pre>
      <p>It reads tokens, models, agent types, timings and which skill ran. Never prompts, answers or tool output, whatever content is set to. Safe to run again: every event is keyed, so nothing is counted twice.</p>
    </div>
    <div style="padding:0 20px 16px"><div class="p-notice"><span class="i">i</span><p><b>These logs don't last.</b> Claude Code clears old logs by its <code>cleanupPeriodDays</code> setting, so the history worth importing can shrink. Import early.</p></div></div></section>`;
  }

  /* ---------- Live with the model check (made-up sessions) ---------- */
  const ROWS = [
    { n: 'main', role: 'orchestrator', m: 'opus', st: 'working', what: 'Waiting on implementer', sub: [['Agent', '4m 02s']], tok: '1.84M', cost: '$1.92', d: 0 },
    { n: 'implementer', role: 'developer', m: 'opus', st: 'model', what: 'Editing src/lib/backend/firebase.ts', sub: [['its file says', 'Sonnet 5.5'], ['runs', '4m 02s']], tok: '612k', cost: '$0.71', d: 1 },
    { n: 'workflow agent', role: 'generalist', m: 'opus', st: 'model', what: 'Reviewing the diff for #331', sub: [['no file, ceiling', 'Sonnet 5.5'], ['runs', '1m 40s']], tok: '388k', cost: '$0.44', d: 1 },
    { n: 'test-runner', role: 'tester', m: 'haiku', st: 'done', what: 'Ran the gate: 1,412 tests pass', sub: [['done in', '2m 11s']], tok: '96k', cost: '$0.02', d: 1 },
  ];
  const STATE = { working: 'working', model: 'pricier model', done: 'done', waiting: 'waiting for you' };
  const pill = (s) => `<span class="p-state s-${s}">${STATE[s]}</span>`;
  function live() {
    return `<div class="p-head"><h1>2 sessions running</h1><div class="p-tally"><span style="--c-dot:var(--ok-dot)">2 at work</span><span style="--c-dot:var(--wait-dot)">0 waiting for you</span><span style="--c-dot:var(--wait-dot)">2 on a pricier model</span><span style="--c-dot:var(--bad-dot)">0 stalled</span><span style="--c-dot:var(--done-dot)">1 done</span></div></div>
    <section class="p-card needs" aria-labelledby="needs-h"><div class="p-card-h"><h3 id="needs-h">Needs you</h3><span class="p-hint">2 agents</span></div>
      <div class="need">${pill('model')}<span><b>implementer</b> in <b>mobile-app</b> runs on Opus 5.5; its agent file says Sonnet 5.5</span><span class="since num">4m 02s</span><button type="button" class="p-btn">Open</button></div>
      <div class="need">${pill('model')}<span>A <b>workflow agent</b> in <b>mobile-app</b> runs on Opus 5.5; agents with no file are held to Sonnet 5.5</span><span class="since num">1m 40s</span><button type="button" class="p-btn">Open</button></div>
    </section>
    <section class="p-card" aria-label="mobile-app">
      <div class="shead"><div class="who"><div class="l1"><h2>mobile-app</h2><span class="p-chip branch">fix/214-late-reminders</span></div><span class="meta">mbp · started 21:02 · running 12m 30s</span></div>
        <div class="stats"><span class="p-stat"><span class="k">Tokens</span><span class="v">2.94M</span></span><span class="p-stat"><span class="k">API-equivalent</span><span class="v">$3.09</span></span><span class="p-meter" style="width:132px"><span class="k">Context 38%</span><span class="p-track"><i style="width:38%"></i></span></span></div></div>
      <div class="cols" aria-hidden="true"><span>Agent</span><span>Doing now</span><span>Model</span><span class="r">Tokens</span><span class="r">Cost</span><span class="r">State</span></div>
      ${ROWS.map((a) => `<div class="agent d${a.d} is-${a.st}" role="button" tabindex="0" aria-label="${a.n}, ${STATE[a.st]}">
        <span class="name">${av(a.n[0].toUpperCase(), a.m)}<span><b>${a.n}</b><small>${a.role}</small></span></span>
        <span class="doing"><span class="what">${a.what}</span><span class="sub">${a.sub.map(([k, v]) => `<span>${k} <span class="num">${v}</span></span>`).join('')}</span></span>
        <span class="m">${model(a.m)}</span><span class="tok r num">${a.tok}</span><span class="cost r num">${a.cost}</span>
        <span class="facts">${model(a.m)}<span class="num">${a.tok} tok</span><span class="num">${a.cost}</span></span>${pill(a.st)}</div>`).join('')}
      <details class="p-explain"><summary>How the model check works</summary><p>An agent is flagged when it runs on a pricier model than it should: its agent file's <code>model:</code>, or for an agent with no file of its own (general-purpose, workflow agents, <code>model: inherit</code>) the ceiling you set, Sonnet unless you change it. The main session is never flagged. It shows here, in the status line and as one notification, and stays in the Ledger.</p></details>
    </section>
    <p class="foot">Made-up sessions. In one project's real history the agent-file check alone would have fired 0 times: all 53 typed runs matched their file. The waste was generic agents on Opus, $548–562 a week in early October.</p>`;
  }

  /* ---------- Status line ---------- */
  function status() {
    const L = [
      ['👥 3 · 1.2M tok · ctx 41%', false, '<b>Today, unchanged.</b> Active agents, tokens, context.'],
      ['⚠ Explore: WebFetch 17m', true, '<b>A stall still comes first</b>, as now.'],
      ['⚠ implementer on Opus, file says Sonnet', true, '<b>New: a pricier model</b>, next in line; it clears when the agent ends.'],
      ['👥 3 · 1.2M tok · ctx 41% · Oct 81%', false, '<b>New: the month\'s goal</b>, from 80%, at the end of the line.'],
      ['⚠ mobile-app over its October goal: $2,540 of $2,500', true, '<b>New: past the goal</b>, until the month ends or the goal changes. Nothing is stopped.'],
    ];
    return `<div class="p-head"><h1>The status line</h1><span class="p-sub">One line under the prompt, in the terminal and the desktop app; the most urgent thing wins</span></div>
    <section class="p-card"><div class="p-card-b term">${L.map(([t, w, why]) => `<div class="line"><span class="why">${why}</span><span class="sl${w ? ' w' : ''}">${esc(t)}</span></div>`).join('')}</div>
      <details class="p-explain"><summary>Order, when several are true</summary><p>A stall, then a pricier model, then past the goal; the goal's percentage rides on the normal line. Each of the new ones also sends one notification when it first happens, like a stall.</p></details></section>`;
  }

  /* ---------- Plan and decisions ---------- */
  function plan() {
    return `<div class="p-head"><h1>v0.2 Measure</h1><span class="p-sub">Is it getting cheaper? The plan approved on 22 Oct, checked against the real data</span></div>
    <div class="grid2"><section class="p-card"><div class="p-card-h"><h3>What the data says</h3><span class="p-hint">mobile-app, Claude Code's logs, 20 Aug to 24 Oct</span></div><div class="p-card-b"><ol class="facts-l">
      <li><b>The graph has no real history.</b> The plugin isn't in your daily sessions: agent-orb holds 15 sessions, mobile-app 2, all from 19–22 Oct. The logs hold 10 weeks.</li>
      <li><b>Generic agents were the waste.</b> Workflow agents with no model of their own inherited Opus: $363, $198, $562, $548 in four weeks. After 20 Oct, $41 a week.</li>
      <li><b>A check on agent files alone finds nothing.</b> 27 implementer, 12 reviewer, 14 test-runner runs, all on their file's model.</li>
      <li><b>Sessions are long.</b> 1–2 a week, carrying 4,000–12,000 requests a week between them; "per session" means little here, per active day and per prompt do.</li>
      <li><b>Adding agents changed nothing; routing to them did.</b> They arrived 16 Oct and cost $0 until 20 Oct.</li>
      <li><b>Neo4j Community can't dump while running.</b> 521 MB today; a nightly dump needs a stop of seconds, which the plugin's queue covers (criterion E).</li>
    </ol></div></section>
    <section class="p-card"><div class="p-card-h"><h3>Slices</h3><span class="p-hint">each ends with a local preview</span></div><div class="p-card-b slices">
      <div class="slice"><span class="n">1</span><div><b>History and Trends</b><p>The import from Claude Code's logs; Trends in the Ledger by who spent and by model, per week and day, per active day and per prompt, cache share; changes from git.</p></div><span class="done">The done check runs here: change 2's numbers against a count by hand.</span></div>
      <div class="slice"><span class="n">2</span><div><b>The model check</b><p>Live rows, Needs you, the status line and a notification; the ceiling for agents with no file.</p></div></div>
      <div class="slice"><span class="n">3</span><div><b>Fingerprints and the goal</b><p>The plugin fingerprints agents, skills, CLAUDE.md and your rules at session start; the monthly goal and its status line.</p></div></div>
      <div class="slice"><span class="n">4</span><div><b>Nightly backup</b><p>A script on the host, scheduled by launchd here and cron on Linux; one restore tried.</p></div></div>
    </div></section></div>
    <section class="p-card"><div class="p-card-h"><h3>Yours to do, outside the code</h3></div><div class="p-card-b"><ul class="owner">
      <li>Turn the plugin on in your daily sessions, so the graph carries on from the import.</li>
      <li>Fix GitHub billing, then rerun the v0.1.0 release workflow: it publishes the server image.</li>
      <li>Make the repo public, when you want the launch.</li>
    </ul></div></section>`;
  }

  const DECIDE = {
    trends: ['<b>Import history from Claude Code\'s logs</b> (new to the plan): a one-off <code>docker compose run</code> of the server image, usage and metadata only, keyed so a second run counts nothing twice. <i>Recommended: yes, as slice 1.</i>',
      '<b>Trends lives in the Ledger</b>, as Totals | Trends; the nav stays at five. <i>Recommended.</i>',
      '<b>Per active day and per prompt</b>, instead of per session and per turn. <i>Recommended: sessions here run for days.</i>',
      '<b>Split by who spent</b> by default (main session, agents on their own model, generic agents), by model one tap away; green and amber for the two kinds of agent. <i>Recommended.</i>',
      '<b>A change compares up to 7 whole days each side</b>, per active day. <i>Recommended.</i>',
      '<b>The goal is API-equivalent dollars per project per month</b>; the status line warns from 80%, nothing is stopped. <i>Recommended.</i>'],
    import: ['<b>The import runs from the server image</b>, with the logs mounted read-only for that one run; nothing to install. <i>Recommended over a plugin command: the plugin can\'t read a file over 4 MiB, and one project\'s logs are 281 MB.</i>',
      '<b>Metadata only, whatever content is set to.</b> Text import can come with v0.3\'s search. <i>Recommended.</i>',
      '<b>Say that the logs expire.</b> <i>Recommended: one notice, no setting changed for you.</i>'],
    live: ['<b>The check:</b> the agent file\'s <code>model:</code>; with no file (general-purpose, workflow agents, <code>inherit</code>) a ceiling you set, Sonnet by default; the main session never. <i>Recommended: the file alone would have caught nothing.</i>',
      '<b>Its word is "pricier model", in amber</b> like waiting, its reason in the row; it goes in Needs you. <i>Recommended.</i>',
      '<b>One notification</b> when it first happens, like a stall. <i>Recommended.</i>'],
    status: ['<b>Order:</b> a stall, then a pricier model, then past the goal; the goal\'s percentage rides on the normal line from 80%. <i>Recommended.</i>'],
    plan: ['<b>What a change watches:</b> the project\'s <code>.claude/</code> agents and skills and its CLAUDE.md (git for the past, fingerprints from now) plus your <code>~/.claude/CLAUDE.md</code> and rules (fingerprints only). <i>Recommended: the 20 Oct change was half in your rules.</i>',
      '<b>Backup:</b> a nightly host script that stops Neo4j for the dump, copies the text store with <code>VACUUM INTO</code>, and keeps 7. <i>Recommended over APOC\'s online export, which restores slower and less exactly.</i>',
      '<b>Drop "archive old captured text"</b> from v0.2: the store is small; it comes back with v0.3\'s search if needed. <i>Recommended.</i>',
      '<b>Slice order 1 to 4</b> as listed: the done check can run after slice 1. <i>Recommended.</i>'],
  };
  const TITLES = { trends: 'Trends', import: 'no-history', live: 'model check', status: 'status line', plan: 'plan' };
  const RENDER = { trends, import: noHistory, live, status, plan };
  function render() {
    $('#page').innerHTML = RENDER[state.board]();
    document.querySelectorAll('.p-nav a').forEach((a) => a.removeAttribute('aria-current'));
    const cur = { trends: 'trends', import: 'trends', live: 'live' }[state.board];
    if (cur) $(`.p-nav a[data-go="${cur}"]`).setAttribute('aria-current', 'page');
    document.querySelectorAll('#rv-page button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state.board)));
    $('#decide').innerHTML = `<h2>What the ${TITLES[state.board]} board decides</h2><ol>${DECIDE[state.board].map((d) => `<li>${d}</li>`).join('')}</ol>`;
    wireChart();
  }
  document.addEventListener('click', (e) => {
    const t = e.target;
    const mk = t.closest('[data-marker]'); if (mk) { state.marker = +mk.dataset.marker; return render(); }
    const v = t.closest('[data-view]'); if (v) { state.view = v.dataset.view; return render(); }
    const go = t.closest('[data-go]'); if (go) { e.preventDefault(); if (go.dataset.go === 'trends' || go.dataset.go === 'live') { state.board = go.dataset.go; render(); } }
  });
  document.addEventListener('keydown', (e) => { const mk = e.target.closest && e.target.closest('.mk'); if (mk && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); state.marker = +mk.dataset.marker; render(); } });
  const seg = (id, f) => $(id).addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); f(b.dataset.v); });
  seg('#rv-page', (v) => { state.board = v; render(); });
  seg('#rv-theme', (v) => (v === 'system' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', v)));
  seg('#rv-width', (v) => $('#stage').classList.toggle('phone', v === 'phone'));
  const h = location.hash.slice(1); if (RENDER[h]) state.board = h;
  render();
})();
</script>
